<style>
:root {
  --tlo: #eef2f6; --karta: #ffffff; --tekst: #17212b; --tekst2: #546170; --tekst3: #8592a1; --linia: #dce3ea; --linia2: #edf1f5;
  --akcent: #2453c4; --akcent2: #1b3f97; --akcent-tlo: #e8eefc;
  --in: #157a40; --in-tlo: #e0f2e7; --in-mocny: #1d8f4d;
  --out: #a55200; --out-tlo: #fff0da; --out-mocny: #d9730d;
  --home: #2453c4; --home-tlo: #e5ecfc; --home-mocny: #2f63d8;
  --moj: #4b2a9a; --moj-tlo: #efe9fc; --moj-mocny: #6b3fc9;
  --late: #bd2525; --late-tlo: #fde4e4;
  --nota: #5c4400; --nota-tlo: #fff4cc; --nota-linia: #e0b500;
  --st-tlo: #16202c; --st-ciemne: #0d141c;
  --cien: 0 1px 2px rgba(16, 24, 40, .05), 0 3px 12px rgba(16, 24, 40, .06);
  --cien2: 0 10px 40px rgba(16, 24, 40, .22);
  --r: 14px;
  --czcionka: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--tlo); color: var(--tekst); -webkit-text-size-adjust: 100%; }
body { font: 16px/1.45 var(--czcionka); min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
p { margin: 0 0 .75em; }
a { color: var(--akcent); }
.ukryte { display: none !important; }
.szary { color: var(--tekst2); font-size: .88em; }
.maly-tekst { font-size: .85rem; color: var(--tekst2); }
.ikona { width: 1.25em; height: 1.25em; flex: none; display: inline-block; vertical-align: -0.22em; }
.ikona svg { width: 100%; height: 100%; display: block; }
.nowrap { white-space: nowrap; }

/* przyciski i pola */
.przycisk { display: inline-flex; align-items: center; justify-content: center; gap: .5em; border: 1px solid transparent; border-radius: 10px;
  padding: .6em 1em; font-weight: 600; background: var(--akcent); color: #fff; min-height: 44px; transition: filter .15s, transform .05s; text-decoration: none; }
.przycisk:hover { filter: brightness(1.06); }
.przycisk:active { transform: translateY(1px); }
.przycisk:disabled { opacity: .55; cursor: default; filter: none; transform: none; }
.przycisk.drugi { background: var(--karta); color: var(--tekst); border-color: var(--linia); }
.przycisk.drugi:hover { background: #f6f8fa; filter: none; }
.przycisk.niebezp { background: var(--late); }
.przycisk.fiolet { background: var(--moj-mocny); }
.przycisk.maly { min-height: 34px; padding: .35em .75em; font-size: .9rem; border-radius: 8px; }
.przycisk.duzy { min-height: 54px; font-size: 1.05rem; padding: .8em 1.4em; }
.przycisk.szeroki { width: 100%; }
.link { background: none; border: 0; color: var(--akcent); padding: .4em 0; text-decoration: underline; font-size: .9rem; }
.ikona-btn { background: transparent; border: 0; color: inherit; width: 44px; height: 44px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; }
.ikona-btn:hover { background: rgba(255, 255, 255, .1); }
.ikona-btn .ikona { width: 24px; height: 24px; }
label { display: block; font-weight: 600; font-size: .9rem; margin: .8em 0 .35em; }
.pole, input[type=text], input[type=password], input[type=search], input[type=date], input[type=datetime-local], select, textarea {
  width: 100%; border: 1px solid var(--linia); border-radius: 10px; padding: .6em .75em; background: #fff; min-height: 44px; }
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid rgba(36, 83, 196, .3); outline-offset: 1px; border-color: var(--akcent); }
.blad-tekst { color: var(--late); font-weight: 600; min-height: 1.4em; margin: .6em 0 0; }
.przyciski { display: flex; gap: .6em; flex-wrap: wrap; align-items: center; }

/* karty i chipy */
.karta { background: var(--karta); border-radius: var(--r); box-shadow: var(--cien); padding: 20px; }
.chip { display: inline-flex; align-items: center; gap: .35em; padding: .2em .65em; border-radius: 999px; font-size: .85rem; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: currentColor; }
.chip.s-IN { background: var(--in-tlo); color: var(--in); }
.chip.s-OUT { background: var(--out-tlo); color: var(--out); }
.chip.s-HOME { background: var(--home-tlo); color: var(--home); }
.chip.s-LATE { background: var(--late-tlo); color: var(--late); }
.chip.s-NOTA { background: var(--nota-tlo); color: var(--nota); }
.chip.s-MOJ { background: var(--moj-tlo); color: var(--moj); }
.chip.s-NOTA::before, .chip.bez::before { display: none; }

/* ekran logowania / konfiguracji */
.ekran-srodek { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
.autor { text-align: center; font-size: .78rem; line-height: 1.5; color: var(--tekst3); padding: 16px 16px 20px; }
.autor a { color: inherit; }
.ekran-srodek .autor { padding-bottom: 0; max-width: 440px; }
.st .autor { padding: 0; margin-top: -8px; font-size: .7rem; color: #6c7c8f; }
.okno-wejscia { width: 100%; max-width: 440px; }
.okno-wejscia .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--akcent); color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.okno-wejscia .logo .ikona { width: 30px; height: 30px; }
.okno-wejscia h1 { margin-bottom: .2em; }
.okno-wejscia .podtytul { color: var(--tekst2); margin-bottom: 1.2em; }
.okno-wejscia details { margin-top: 1em; font-size: .9rem; color: var(--tekst2); }
.okno-wejscia summary { cursor: pointer; color: var(--akcent); }
.okno-wejscia ol { padding-left: 1.2em; }

/* ══ STANOWISKO PRZY DRZWIACH ══ */
.st { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 12px; background: var(--st-tlo); color: #f1f5f9;
  padding: max(12px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom)); overflow: hidden; }
.st-gora { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.st-tytul { flex: 1 1 220px; min-width: 0; }
.st-nazwa { font-weight: 800; font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-zegar { font-size: .95rem; color: #9aa8b8; font-variant-numeric: tabular-nums; }
.st-licz { display: flex; gap: 8px; flex-wrap: wrap; }
.st-licz .l { background: rgba(255, 255, 255, .07); border-radius: 12px; padding: 5px 12px; text-align: center; min-width: 86px; }
.st-licz .l b { display: block; font-size: 1.35rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.st-licz .l span { font-size: .75rem; color: #b9c6d4; white-space: nowrap; }
.st-licz .l.IN b { color: #6fdc9b; } .st-licz .l.OUT b { color: #ffb45c; } .st-licz .l.HOME b { color: #8fb1ff; } .st-licz .l.MOJ b { color: #c4b0ff; }
.st-prawa { display: flex; align-items: center; gap: 6px; }
.siec { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .08); color: #c8d4e0; white-space: nowrap; }
.siec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #8592a1; }
.siec.ok::before { background: #4ade80; } .siec.czeka::before { background: #fbbf24; } .siec.brak::before { background: #f87171; }
.st-zakl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.st-zakl button { min-height: clamp(54px, 9vh, 74px); border-radius: 16px; border: 2px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .05); color: #c7d2de;
  font-weight: 800; letter-spacing: .06em; font-size: clamp(1.05rem, 2.2vw, 1.55rem); display: flex; align-items: center; justify-content: center; gap: 14px; }
.st-zakl button .ikona { width: 1.35em; height: 1.35em; }
.st-zakl button.aktywna { background: #fff; color: #17212b; border-color: #fff; }
.st-zakl button.aktywna[data-zak="moj"] .ikona { color: var(--moj-mocny); }
.st-tresc { flex: 1; min-height: 0; display: grid; gap: 14px; }
.st-tresc.wyj { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.wielki { border: 0; border-radius: 22px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 18px; min-height: 0; transition: transform .06s, filter .15s; }
.wielki:active { transform: scale(.985); }
.wielki .ikona { width: clamp(46px, 7vw, 84px); height: clamp(46px, 7vw, 84px); }
.wielki .opis { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.wielki b { font-size: clamp(1.7rem, 3.8vw, 3rem); font-weight: 800; line-height: 1.1; }
.wielki small { font-size: clamp(.95rem, 1.7vw, 1.3rem); opacity: .95; }
.wielki.k-wyj { background: var(--out-mocny); } .wielki.k-wr { background: var(--in-mocny); } .wielki.k-dom { background: var(--home-mocny); }
.st-tresc.moj { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) auto; }
.kafel { border-radius: 22px; background: var(--moj-mocny); color: #fff; display: flex; align-items: center; gap: 18px; padding: 16px 22px; text-align: left; border: 2px solid transparent; min-height: 0; }
.kafel.jasny { background: #f3effc; color: #2e1d5c; border-color: #d7caf3; }
.kafel .ik { width: clamp(52px, 6vw, 66px); height: clamp(52px, 6vw, 66px); border-radius: 16px; background: rgba(255, 255, 255, .2); display: flex; align-items: center; justify-content: center; flex: none; }
.kafel .ik .ikona { width: 55%; height: 55%; }
.kafel.jasny .ik { background: #e4dafc; color: var(--moj-mocny); }
.kafel .tr { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.kafel b { font-size: clamp(1.35rem, 2.6vw, 2.05rem); font-weight: 800; line-height: 1.15; }
.kafel .pod { font-size: clamp(.9rem, 1.4vw, 1.1rem); opacity: .92; }
.kafel .ch { align-self: flex-start; background: rgba(255, 255, 255, .2); border-radius: 999px; padding: 3px 12px; font-weight: 800; font-size: clamp(.85rem, 1.3vw, 1rem); }
.kafel.jasny .ch { background: #e4dafc; color: #3b1f8a; }
.kafel .ch.zajety { background: var(--nota-tlo); color: var(--nota); }
.kafel .ch.zamkniete { background: rgba(0, 0, 0, .25); }
.kafel > .ikona { width: 30px; height: 30px; opacity: .9; }
.st-zasady { grid-column: 1 / -1; background: #2a2410; border: 1px solid #6b5a1a; color: #f5d77a; border-radius: 14px; padding: 10px 18px 12px; display: flex; flex-direction: column; gap: 6px; font-size: clamp(1rem, 1.7vw, 1.22rem); line-height: 1.3; }
.st-zasady .tyt { font-weight: 800; font-size: .78em; letter-spacing: .07em; text-transform: uppercase; color: #d9bf63; }
.st-zasady .w { display: flex; align-items: center; gap: 12px; }
.st-zasady .w .ikona { width: 1.45em; height: 1.45em; }
.st-zasady b { color: #fff1b8; }
.st-zasady .w.cz { background: #3a1416; border: 1px solid #7a2a2a; color: #ffb4b4; border-radius: 10px; padding: 5px 10px; margin: 0 -10px; }
.st-zasady .w.cz b { color: #ffd9d9; }
.st-stopka { text-align: center; color: #c7d2de; font-size: 1.02rem; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 26px; }
@media (max-width: 760px), (orientation: portrait) {
  .st { height: auto; min-height: 100vh; overflow: visible; }
  .st-tresc.wyj { grid-template-columns: 1fr; }
  .wielki { flex-direction: row; justify-content: flex-start; text-align: left; min-height: 120px; }
  .wielki .opis { align-items: flex-start; gap: 2px; }
  .st-tresc.moj { grid-template-columns: 1fr; grid-template-rows: none; }
  .kafel { min-height: 120px; }
}

/* warstwa z krokami (okna, podpis, potwierdzenie) */
#warstwa:empty { display: none; }
.ekr { position: fixed; inset: 0; z-index: 40; background: var(--st-ciemne); display: flex; flex-direction: column; color: var(--tekst); animation: pojaw .12s ease-out; overflow: auto; }
.ekr-duch { display: flex; align-items: center; padding: 10px 18px; opacity: .45; color: #f1f5f9; }
.ekr-duch .n { flex: 1; } .ekr-duch b { display: block; font-size: 1rem; } .ekr-duch span { font-size: .8rem; color: #9aa8b8; }
.ekr-srodek { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px 18px; }
.dlg { width: min(960px, 100%); background: #fff; border-radius: 22px; padding: 18px 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); display: flex; flex-direction: column; gap: 12px; }
.dlg.waski { width: min(780px, 100%); }
.dlg-gora { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dlg-gora .opis { flex: 1; color: var(--tekst2); font-size: 1rem; min-width: 0; }
.dlg-gora .opis b { color: var(--tekst); }
.dlg h2 { font-size: clamp(1.35rem, 2.6vw, 1.85rem); font-weight: 800; margin: 0; }
.dlg h3 { font-size: 1.05rem; font-weight: 800; margin: 0; }
.wiersz-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.wstecz { display: inline-flex; align-items: center; gap: 4px; border: 1px solid #cfd8e1; border-radius: 10px; padding: 7px 12px 7px 8px; background: #fff; font-weight: 700; color: var(--tekst); min-height: 40px; }
.wstecz .ikona { width: 18px; height: 18px; }
.wstecz.ciemny { background: transparent; color: #f1f5f9; border-color: rgba(255, 255, 255, .25); }
.pig { border-radius: 999px; padding: 5px 12px; font-size: .88rem; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pig.p-wyj { background: var(--out-tlo); color: var(--out); } .pig.p-dom { background: var(--home-tlo); color: var(--akcent2); }
.pig.p-moj { background: var(--moj-tlo); color: var(--moj); } .pig.p-wr { background: var(--in-tlo); color: var(--in); }
.pig.p-zolta { background: var(--nota-tlo); color: var(--nota); } .pig.p-czerw { background: var(--late-tlo); color: #8f1c1c; }
.pig.p-szara { background: #eef2f6; color: var(--tekst); }
.pig.ciemna.p-wyj { background: rgba(255, 180, 92, .14); color: #ffc47f; border: 1px solid rgba(255, 180, 92, .35); }
.pig.ciemna.p-dom { background: rgba(143, 177, 255, .14); color: #a9c3ff; border: 1px solid rgba(143, 177, 255, .35); }
.pig.ciemna.p-moj { background: rgba(196, 176, 255, .14); color: #d3c4ff; border: 1px solid rgba(196, 176, 255, .35); }
.pig.ciemna.p-wr { background: rgba(111, 220, 155, .14); color: #8be3ad; border: 1px solid rgba(111, 220, 155, .35); }
.siatka-opcji { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.siatka-opcji.cztery { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.siatka-opcji.dwie { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opcja { text-align: left; border-radius: 16px; padding: 14px 18px; min-height: 92px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  border: 2px solid #f5d3a8; background: #fff7ec; color: #5c2d00; transition: transform .06s; }
.opcja:active { transform: scale(.985); }
.opcja b { font-size: clamp(1.15rem, 2vw, 1.4rem); font-weight: 800; line-height: 1.2; }
.opcja small { font-size: .95rem; }
.opcja.srodek { align-items: center; text-align: center; }
.opcja .duza { font-size: clamp(1.6rem, 3vw, 2.1rem); font-weight: 800; line-height: 1.1; }
.opcja.wyb { background: var(--out-mocny); border-color: var(--out-mocny); color: #fff; }
.opcja:disabled, .opcja.wyl { opacity: .42; cursor: default; transform: none; }
.opcja.pomar { background: var(--out-mocny); border-color: var(--out-mocny); color: #fff; }
.opcja.nieb { border-color: #bfd0f7; background: #eef3fd; color: #17306e; }
.opcja.nieb.wyb { background: var(--home-mocny); border-color: var(--home-mocny); color: #fff; }
.opcja.nieb.mocna { background: var(--home-mocny); border-color: var(--home-mocny); color: #fff; }
.opcja.fiol { border-color: #d7caf3; background: #f5f2fc; color: #2e1d5c; }
.opcja.fiol.wyb, .opcja.fiol.mocna { background: var(--moj-mocny); border-color: var(--moj-mocny); color: #fff; }
.opcja.przer { border-style: dashed; background: #fff; }
.opcja.zwiersz { flex-direction: row; align-items: center; justify-content: flex-start; gap: 16px; min-height: 120px; }
.opcja.zwiersz .ik { width: 58px; height: 58px; border-radius: 50%; background: rgba(255, 255, 255, .2); display: flex; align-items: center; justify-content: center; flex: none; }
.opcja.zwiersz .ik .ikona { width: 32px; height: 32px; }
.opcja.zwiersz:not(.mocna):not(.wyb) .ik { background: #e4dafc; }
.opcja.nieb.zwiersz:not(.mocna):not(.wyb) .ik { background: #dfe8fb; }
.opcja.zwiersz .tr { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.czerwony { display: flex; align-items: center; gap: 16px; border: 3px solid var(--late); background: #fff5f5; border-radius: 16px; padding: 12px 18px; text-align: left; color: #4a1010; width: 100%; }
.czerwony .ik { width: 52px; height: 52px; border-radius: 50%; background: var(--late); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.czerwony .ik .ikona { width: 30px; height: 30px; }
.czerwony .tr { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.czerwony .tr b { font-size: 1.3rem; color: #8f1c1c; }
.czerwony .metka { background: var(--late); color: #fff; border-radius: 6px; padding: 1px 7px; font-size: .75rem; font-weight: 800; letter-spacing: .04em; vertical-align: 3px; margin-left: 6px; }
.ramka-cz { background: #fff5f5; border: 3px solid var(--late); border-radius: 16px; padding: 10px 15px; display: flex; flex-direction: column; gap: 7px; color: #4a1010; }
.ramka-cz .t { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 800; color: #8f1c1c; }
.numer { background: #fff; border: 2px solid var(--late); border-radius: 8px; padding: 1px 9px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; color: #17212b; }
.wybor-cz { font: inherit; background: #fff; border: 2px solid #e8b4b4; color: #4a1010; border-radius: 12px; padding: 8px 14px; font-size: 1rem; font-weight: 700; min-height: 48px; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.wybor-cz.wyb { background: #ffe3e3; border-color: var(--late); font-weight: 800; }

            case QRMode.MODE_ALPHA_NUM  : return 11;

                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) &&

                }

                }

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;

	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];

QRCode.prototype = {

		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;

	isDark : function(row, col) {

			throw new Error(row + "," + col);
		}

	getModuleCount : function() {

			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);

	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);

	setupPositionProbePattern : function(row, col)  {

			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {

				} else {

				}

	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);

			var y = row * cs;

						} else {

			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}

			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal

			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

			if (col === 6) col--;
	
			while (true) {

						bitIndex--;

						}
					}

				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

/** Czerwone: po 21:00 (albo po godzinie ze zgody) albo nie wrócił z domu w dniu, który wpisał wychowawca (zgł. 13 – dzień
 *  podany przez ucznia nigdy nie jest spóźnieniem). */
function spozniony(u) {

  if (u.s === 'HOME' && u.pp && u.pz) { const d = ymd(u.pp); const g = (Stan.ustawienia.powroty || [])[dzienTyg(d) - 1]; return teraz() > msZDnia(d, g === null || g === undefined ? 1260 : g); }

// ── grupa wychowawcza (zgł. 8)
const KOLORY_GRUP = ['#be185d', '#0f766e', '#b45309', '#4338ca'];
function nrGrupy(g) { const m = String(g == null ? '' : g).match(/\d+/); return m ? Number(m[0]) : null; }
function kolorGrupy(g) { const n = nrGrupy(g); return n ? KOLORY_GRUP[(n - 1) % KOLORY_GRUP.length] : '#64748b'; }
/** „2” → „Grupa 2”; inna wartość (np. „sportowa”) – bez zmian. */
function nazwaGrupy(g) { const t = String(g == null ? '' : g).trim(); return /^\d+$/.test(t) ? 'Grupa ' + Number(t) : t; }
/** Kolorowy znaczek grupy obok pokoju na ekranach tabletu (duży – w nagłówkach okien). */
function grpZn(g, duzy) { return g ? ' <span class="grp' + (duzy ? ' duzy' : '') + '" style="background:' + kolorGrupy(g) + '">' + esc(nazwaGrupy(g).toLowerCase()) + '</span>' : ''; }
const grupaUcznia = id => { const u = Stan.poId.get(Number(id)); return u ? u.g || '' : ''; };
/** Znaczek grupy do tabel panelu. */
function grp(g) {
  const t = nazwaGrupy(g);
  return t ? '<span class="grp" style="background:' + kolorGrupy(g) + '">' + esc(t) + '</span>' : '<span class="szary">—</span>';
}
/** Grupa ucznia z wiersza listy (serwer podaje g albo id ucznia). */
function grupaWiersza(x) {
  if (x.g !== undefined && x.g !== null && x.g !== '') return x.g;
  const u = x.id ? Stan.poId.get(Number(x.id)) : null;
  return u ? u.g || '' : '';
}
/** Sortowanie list z uczniami: według grupy, pokoju albo alfabetycznie. Każdy wiersz: { u: nazwa, p: pokój, g: grupa }. */
const SORTOWANIA = [['grupa', 'według grupy'], ['pokoj', 'według pokoju'], ['alfabet', 'alfabetycznie']];
function porownajWiersze(a, b, tryb) {
  const ga = nrGrupy(a.g), gb = nrGrupy(b.g);
  const poGrupie = (ga === null ? 1e9 : ga) - (gb === null ? 1e9 : gb) || porownaj(String(a.g || ''), String(b.g || ''));
  const poPokoju = porownaj(String(a.p || ''), String(b.p || ''));
  const poNazwie = porownaj(String(a.u || ''), String(b.u || ''));
  if (tryb === 'grupa') return poGrupie || poPokoju || poNazwie;
  if (tryb === 'pokoj') return poPokoju || poNazwie;
  return poNazwie || poPokoju;
}
/** Wybór sortowania nad listą (zapamiętany na urządzeniu). Pierwsza opcja to obecna kolejność listy, np. „od najnowszych”. */
function wyborSortowania(klucz, pierwsza, domyslna) {
  const v = Pamiec.get('sort_' + klucz, domyslna || pierwsza[0]);
  return `<select class="sortuj" data-sortuj="${esc(klucz)}" aria-label="Sortowanie">${[pierwsza].concat(SORTOWANIA).map(o => `<option value="${o[0]}" ${v === o[0] ? 'selected' : ''}>Sortuj: ${esc(o[1])}</option>`).join('')}</select>`;
}
function sortowanieListy(klucz, domyslna) { return Pamiec.get('sort_' + klucz, domyslna); }
/** Sortuje kopię listy wierszy; tryb spoza SORTOWANIA → kolejność bez zmian. */
function posortujWiersze(lista, tryb, nazwa) {
  if (!SORTOWANIA.some(o => o[0] === tryb)) return lista.slice();
  return lista.map(x => ({ x: x, k: { u: nazwa ? nazwa(x) : x.u, p: x.p, g: grupaWiersza(x) } }))
    .sort((a, b) => porownajWiersze(a.k, b.k, tryb)).map(o => o.x);

// ═══════════════════════════ POŁĄCZENIE Z SERWEREM ═══════════════════════════
class BladApi extends Error { constructor(tekst, rodzaj) { super(tekst); this.rodzaj = rodzaj; } }
function adresWbudowany() { return /^https?:\/\//.test(ADRES_SERWERA) ? ADRES_SERWERA : ''; }
function adresSerwera() { return String(adresWbudowany() || Pamiec.get('serwer', '') || '').trim(); }
/** Akceptujemy tylko adresy Google Apps Script (…/exec) – link z obcym adresem nie przejmie logowania. */
function poprawnyAdres(a) {
  return /^https:\/\/script\.google\.com\/[^\s?#]+\/exec\/?$/.test(a) || /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/[^\s?#]*exec$/.test(a);
}

async function api(f, a, opcje) {
  const url = (opcje && opcje.url) || adresSerwera();
  if (!url) throw new BladApi('Brak adresu serwera.', 'konfig');
  const limit = (opcje && opcje.limit) || 45000;
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), limit) : null;
  let odp;
  try {
    odp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ f: f, token: Stan.token || '', a: a || {} }),
      redirect: 'follow',
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch (e) {
    throw new BladApi(navigator.onLine === false ? 'Brak internetu.' : 'Nie udało się połączyć z serwerem.', 'siec');
  } finally {
    if (timer) clearTimeout(timer);
  }
  if (!odp.ok) throw new BladApi('Serwer odpowiedział błędem (' + odp.status + ').', 'siec');
  let dane;
  try { dane = await odp.json(); } catch (e) { throw new BladApi('Serwer zwrócił nieoczekiwaną odpowiedź. Sprawdź adres serwera i ustawienia wdrożenia.', 'serwer'); }
  Stan.ostatniKontakt = Date.now();
  Stan.bladSieci = false;
  if (dane && dane.auth) {
    sesjaWygasla(dane.blad);
    throw new BladApi(dane.blad || 'Zaloguj się ponownie.', 'auth');
  }
  return dane || {};
}

function normKod(t) {
  let k = String(t == null ? '' : t).trim().toUpperCase().replace(/\s+/g, '');
  if (/^\d+$/.test(k)) k = k.replace(/^0+(?=\d)/, '');
  return k;
}
function indeksuj() {
  Stan.poKodzie = new Map();
  Stan.poId = new Map();
  Stan.uczniowie.forEach(u => {
    Stan.poId.set(u.id, u);
    if (u.kod) Stan.poKodzie.set(normKod(u.kod), u);
    if (u.rf) Stan.poKodzie.set(normKod(u.rf), u);
  });
}
/** Zdarzenie zmieniające status ucznia (lokalnie, zanim serwer potwierdzi). */
function zastosujZdarzenie(u, ev) {
  const s = AKCJA_STATUS[ev.akcja];
  if (!s) return;
  if (u.s !== s && u.nt) u.nt = '';
  u.s = s;
  u.od = ev.ts;
  if (s === 'OUT') {
    const limit = terminPowrotu(ev.ts);
    u.pp = ev.powrot && ev.powrot > ev.ts - 60000 ? ev.powrot : limit;
    u.sz = [ev.cel, ev.uwaga].filter(Boolean).join(' · ');
    u.zg = ev.zgoda || '';
  } else if (s === 'HOME') {
    u.pp = ev.powrotData ? msZDnia(ev.powrotData, 12 * 60) : null;
    u.pz = ev.powrotData && ev.sposob === 'panel' ? 1 : 0;      // dzień powrotu wpisał wychowawca → liczy się spóźnienie
    u.sz = ev.rodzaj === 'tydzien' ? ['poza weekendem', ev.powod].filter(Boolean).join(' · ') : 'weekend';
    u.zg = ev.rodzaj === 'tydzien' && ev.potwierdzenie ? potwierdzenieRodzica(ev.potwierdzenie).zgoda : '';
  } else {
    u.pp = null; u.sz = ''; u.zg = '';
  }
  if (s !== 'HOME') u.pz = 0;
}
function zastosujRzecz(ev) {
  const r = Stan.rzeczy.find(x => x.id === ev.rzecz);
  if (!r) return;
  if (ev.akcja === 'POBRANIE') {
    const u = Stan.poId.get(ev.id);
    r.ma = { id: ev.id, od: ev.ts, u: u ? krotko(u) : '', p: u ? u.p : '' };
  } else if (ev.akcja === 'ZWROT' && r.ma && (r.ma.id === ev.id || ev.sposob === 'panel')) {
    r.ma = null;
  }
}
function zastosujWeekend(ev) {
  if (!Stan.weekend || ev.weekend !== Stan.weekend.piatek) return;
  Stan.weekend.zapisani = Stan.weekend.zapisani || {};
  if (ev.akcja === 'WEEKEND_ZAPIS') Stan.weekend.zapisani[ev.id] = { z: ev.opis, t: ev.ts };
  else if (ev.akcja === 'WEEKEND_WYPIS') delete Stan.weekend.zapisani[ev.id];
}
function zastosujWszystko(ev) {
  if (AKCJA_STATUS[ev.akcja]) { const u = Stan.poId.get(ev.id); if (u && (!u.od || ev.ts >= u.od)) zastosujZdarzenie(u, ev); }
  else if (ev.akcja === 'POBRANIE' || ev.akcja === 'ZWROT') zastosujRzecz(ev);
  else zastosujWeekend(ev);
}
/** Dane z serwera + zdarzenia, które jeszcze czekają w kolejce. */
function ustawDane(d) {
  if (Array.isArray(d.uczniowie)) { Stan.uczniowie = d.uczniowie; indeksuj(); }
  if (Array.isArray(d.rzeczy)) Stan.rzeczy = d.rzeczy;
  if (d.weekend) Stan.weekend = d.weekend;
  Stan.kolejka.forEach(zastosujWszystko);
  Pamiec.set('uczniowie', Stan.uczniowie);
  Pamiec.set('rzeczy', Stan.rzeczy);
  Pamiec.set('weekend', Stan.weekend);
}
function aktualizujUcznia(nowy) {
  if (!nowy || !nowy.id) return;
  if (Stan.kolejka.some(ev => ev.id === nowy.id && AKCJA_STATUS[ev.akcja])) return;   // lokalny stan jest nowszy
  const i = Stan.uczniowie.findIndex(u => u.id === nowy.id);
  if (i >= 0) Stan.uczniowie[i] = nowy; else Stan.uczniowie.push(nowy);
  indeksuj();
  Pamiec.set('uczniowie', Stan.uczniowie);
}
function rzeczyUcznia(id) { return Stan.rzeczy.filter(r => r.ma && r.ma.id === id); }
function rzecz(id) { return Stan.rzeczy.find(r => r.id === id) || null; }
function zapisanyNaWeekend(id) {
  const w = Stan.weekend;
  return w && w.zapisani && w.zapisani[id] ? w.zapisani[id] : null;
}
function liczniki() {
  const c = { razem: 0, IN: 0, OUT: 0, HOME: 0, LATE: 0, CZEKA: 0, Z_DOMU: 0, DZIS_Z_DOMU: 0, WYDANE: 0, PO22: 0 };
  const dzis = ymd(teraz());
  Stan.uczniowie.forEach(u => {
    c.razem++;
    c[u.s] = (c[u.s] || 0) + 1;
    if (spozniony(u)) c.LATE++;
    if (czekamy(u)) { c.CZEKA++; if (u.s === 'HOME') c.Z_DOMU++; }
    if (u.s === 'HOME' && u.pp && ymd(u.pp) === dzis) c.DZIS_Z_DOMU++;
  });
  const po22 = czyPo22();
  Stan.rzeczy.forEach(r => { if (r.ma) { c.WYDANE++; if (po22 || ymd(r.ma.od) < dzis) c.PO22++; } });
  return c;
}
function czyPo22() { const g = Stan.ustawienia.wydawanieDo; return g !== null && g !== undefined && czesciCzasu(teraz()).min >= g; }

async function odswiezStan(cicho) {
  if (Stan.odswiezanie || !Stan.token) return;
  Stan.odswiezanie = true;
  try {
    const gen = Stan.zapisGen, zapisWLocie = !!Stan.wysylanie;
    const d = await api('stan');
    if (!d.ok) { if (!cicho) toast(d.blad || 'Nie udało się pobrać danych.', 'blad'); return; }
    Stan.przesuniecie = d.czas - Date.now();
    Stan.nazwa = d.nazwa; Pamiec.set('nazwa', d.nazwa);
    Stan.ustawienia = Object.assign({}, Stan.ustawienia, d.ustawienia || {}); Pamiec.set('ustawienia', Stan.ustawienia);
    if (d.rola && d.rola !== Stan.rola) { Stan.rola = d.rola; Pamiec.set('rola', d.rola); }
    Stan.wersjaSerwera = d.wersja || '1';
    if (gen !== Stan.zapisGen || zapisWLocie || Stan.wysylanie) {
      // w trakcie pobierania poszedł zapis – te dane mogą być starsze niż to, co już wiemy; pobierz jeszcze raz
      clearTimeout(Stan.ponownyStan);
      Stan.ponownyStan = setTimeout(() => odswiezStan(true), 1500);
      return;
    }
    ustawDane(d);
    Stan.ostatnieOdswiezenie = teraz();
    Stan.bladSieci = false;
    przerysuj();
  } catch (e) {
    if (e.rodzaj === 'siec') Stan.bladSieci = true;
    if (!cicho && e.rodzaj !== 'auth') toast(e.message, 'blad');
  } finally {
    Stan.odswiezanie = false;
    odswiezWskaznik();
  }
}
function przerysuj() {
  if (Stan.widok === 'skaner') odswiezStanowisko();
  else if (Stan.widok === 'panel') { rysujKpi(); rysujZakladke(true); rysujGorePanelu(); }
}

// ── kolejka zdarzeń (działa też bez internetu; nowe zdarzenia czekają 3 s na „Cofnij”)
function zapiszKolejke() { Pamiec.set('kolejka', Stan.kolejka); }
function gotoweDoWysylki() { const t = Date.now(); return Stan.kolejka.filter(e => !(e.wstrzymaj > t)); }
function zaplanujWysylke() {
  clearTimeout(Stan.wysylkaTimer);
  const czekajace = Stan.kolejka.filter(e => e.wstrzymaj > Date.now());
  if (!czekajace.length) return;
  const najblizej = Math.min.apply(null, czekajace.map(e => e.wstrzymaj));
  Stan.wysylkaTimer = setTimeout(wyslijKolejke, Math.max(50, najblizej - Date.now() + 30));
}
async function wyslijKolejke() {
  if (Stan.wysylanie || !Stan.token) { odswiezWskaznik(); return; }
  if (!gotoweDoWysylki().length) { zaplanujWysylke(); odswiezWskaznik(); return; }
  Stan.wysylanie = true;
  const bylBlad = Stan.bladSieci || !!Stan.ostatniBladSerwera;
  odswiezWskaznik();
  let odswiezPo = false, ponowPo = false;
  try {
    while (Stan.token) {
      const paczka = gotoweDoWysylki().slice(0, 20);
      if (!paczka.length) break;
      const d = await api('zapisz', { zdarzenia: paczka.map(e => { const k = Object.assign({}, e); delete k.wstrzymaj; delete k.opisLok; return k; }) });
      if (!d.ok) {
        // błąd po stronie serwera (np. chwilowa awaria Google) – zdarzenia zostają w kolejce i zostaną wysłane ponownie
        if (!d.ponow && Stan.ostatniBladSerwera !== d.blad) toast('Serwer: ' + (d.blad || 'błąd') + ' – ponowię wysyłanie.', 'blad', 6000);
        Stan.ostatniBladSerwera = d.blad;
        throw new BladApi(d.blad || 'Błąd serwera', 'serwer');
      }
      Stan.ostatniBladSerwera = null;
      Stan.zapisGen++;
      const wyniki = d.wyniki || [];
      const doPonowienia = new Set(wyniki.filter(w => !w.ok && w.ponow).map(w => w.uid));   // chwilowy błąd Google – zostaje w kolejce
      const wyslane = new Set(paczka.map(e => e.uid).filter(u => !doPonowienia.has(u)));
      Stan.kolejka = Stan.kolejka.filter(e => !wyslane.has(e.uid));
      zapiszKolejke();
      wyniki.forEach(w => {
        if (w.ok) oznaczOstatnie(w.uid, 'ok');
        else if (!w.ponow) { oznaczOstatnie(w.uid, 'blad'); toast('Nie zapisano: ' + w.blad, 'blad', 8000); odswiezPo = true; if (Stan.widok === 'skaner') owca(); }
      });
      if (d.czas) Stan.przesuniecie = d.czas - Date.now();
      (d.uczniowie || []).forEach(aktualizujUcznia);
      if (d.rzeczy || d.weekend) ustawDane({ rzeczy: d.rzeczy, weekend: d.weekend });
      Stan.bladSieci = false;
      if (Stan.widok === 'skaner') odswiezStanowisko();
      else if (Stan.widok === 'panel') przerysuj();
      if (doPonowienia.size) { ponowPo = true; break; }
    }
    if (ponowPo) { clearTimeout(Stan.ponowTimer); Stan.ponowTimer = setTimeout(wyslijKolejke, 30000); }
    if ((bylBlad || odswiezPo) && Stan.token) setTimeout(() => odswiezStan(true), 50);   // pełny stan po przerwie albo po odrzuconym zdarzeniu
  } catch (e) {
    if (e.rodzaj === 'siec') Stan.bladSieci = true;
    if (e.rodzaj !== 'auth') { clearTimeout(Stan.ponowTimer); Stan.ponowTimer = setTimeout(wyslijKolejke, e.rodzaj === 'siec' ? 20000 : 45000); }
  } finally {
    Stan.wysylanie = false;
    zaplanujWysylke();
    odswiezWskaznik();
  }
}

// ═══════════════════════════ POWIADOMIENIA I OKNA ═══════════════════════════
function toast(tekst, typ, czas) {
  const el = document.createElement('div');
  el.className = 'toast ' + (typ || '');
  el.textContent = tekst;
  $('#powiadomienia').appendChild(el);
  setTimeout(() => el.remove(), czas || 3500);
}
function otworzNakladke(html, opcje) {
  opcje = opcje || {};
  const n = document.createElement('div');
  n.className = 'nakladka ' + (opcje.klasa || '');
  n.innerHTML = html;
  n.addEventListener('mousedown', e => { if (e.target === n && opcje.zamykanieTlem !== false) zamknijNakladke(n); });
  $('#nakladki').appendChild(n);
  n._naZamkniecie = opcje.naZamkniecie;
  const pierwsze = n.querySelector('[autofocus]');
  if (pierwsze) setTimeout(() => pierwsze.focus(), 30);
  return n;
}
function zamknijNakladke(n) {
  if (!n || !n.parentNode) return;
  n.remove();
  if (typeof n._naZamkniecie === 'function') n._naZamkniecie();
}
function potwierdz(o) {
  return new Promise(ok => {
    const tresc = Array.isArray(o.tresc) ? '<ul class="ostrzezenia">' + o.tresc.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : '<p>' + esc(o.tresc) + '</p>';
    let wynik = false;
    const n = otworzNakladke(`<div class="okno" role="dialog" aria-modal="true">
        <h2>${o.ikona === false ? '' : ikona('uwaga') + ' '}${esc(o.tytul)}</h2>${tresc}
        <div class="stopka"><button class="przycisk drugi duzy" data-w="nie">${esc(o.nie || 'Anuluj')}</button>
        <button class="przycisk duzy ${o.niebezp ? 'niebezp' : ''}" data-w="tak" autofocus>${esc(o.tak || 'OK')}</button></div></div>`,
    { klasa: 'nad-wszystkim', naZamkniecie: () => ok(wynik) });
    n.style.zIndex = 70;
    n.addEventListener('click', e => {
      const b = e.target.closest('[data-w]');
      if (!b) return;
      wynik = b.dataset.w === 'tak';
      zamknijNakladke(n);
    });
  });

function zaladujSkrypt(src) {
  zaladujSkrypt._p = zaladujSkrypt._p || {};
  if (!zaladujSkrypt._p[src]) {
    zaladujSkrypt._p[src] = new Promise((ok, zle) => {
      const s = document.createElement('script');
      s.src = src; s.async = true; s.crossOrigin = 'anonymous';
      s.onload = ok;
      s.onerror = () => { delete zaladujSkrypt._p[src]; s.remove(); zle(new Error('Nie udało się wczytać ' + src)); };
      document.head.appendChild(s);
    });
  }
  return zaladujSkrypt._p[src];
}

// ── samoczynna aktualizacja: gdy pod linkiem pojawi się nowa wersja strony, urządzenie wczyta ją samo,
//    ale dopiero wtedy, gdy nikt z niego nie korzysta (tablet przy drzwiach może być otwarty tygodniami)
const AKTUALIZACJA_CO_MS = 30 * 60 * 1000;
const Aktualizacja = { ruch: Date.now(), nowa: null, timer: null, sprawdzanie: false };
['pointerdown', 'keydown', 'input'].forEach(t => document.addEventListener(t, () => { Aktualizacja.ruch = Date.now(); }, true));
async function sprawdzAktualizacje() {
  if (!/^https?:$/.test(location.protocol) || navigator.onLine === false || Aktualizacja.nowa || Aktualizacja.sprawdzanie) return;
  Aktualizacja.sprawdzanie = true;
  try {
    const r = await fetch(location.pathname, { cache: 'no-cache' });   // bez zmian: serwer odpowiada krótko „304”, strona z pamięci przeglądarki
    if (!r.ok) return;
    const m = (await r.text()).match(/const WERSJA = '([0-9][0-9A-Za-z.\-]*)'/);
    if (!m || m[1] === WERSJA) return;
    const proba = Pamiec.get('aktualizacja', null);
    if (proba && proba.w === m[1] && Date.now() - proba.t < 6 * 3600 * 1000) return;   // już próbowaliśmy – bez pętli przeładowań
    Aktualizacja.nowa = m[1];
    przeladujGdyWolne();
  } catch (e) {
    /* brak sieci – spróbujemy później */
  } finally {
    Aktualizacja.sprawdzanie = false;
  }
}
function przeladujGdyWolne() {
  clearTimeout(Aktualizacja.timer);
  if (!Aktualizacja.nowa) return;
  const cisza = Stan.widok === 'panel' ? 10 * 60 * 1000 : 2 * 60 * 1000;
  const el = document.activeElement;
  const zajete = Date.now() - Aktualizacja.ruch < cisza
    || $$('#nakladki .nakladka').length > 0
    || (Stan.widok === 'skaner' && !!St.ekran)
    || !!Stan.wysylanie
    || !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))
    || (Stan.kolejka || []).some(e => e.wstrzymaj > Date.now());
  if (zajete) { Aktualizacja.timer = setTimeout(przeladujGdyWolne, 30 * 1000); return; }
  Pamiec.set('aktualizacja', { w: Aktualizacja.nowa, t: Date.now() });
  zapiszKolejke();
  location.reload();
}

function start() {
  try {
    const p = new URLSearchParams(location.search);
    const s = (p.get('serwer') || '').trim();
    if (s && !adresWbudowany() && poprawnyAdres(s)) {
      if (s !== Pamiec.get('serwer', '')) Pamiec.del('nazwa');
      Pamiec.set('serwer', s);
    }
    if (p.has('serwer')) {
      p.delete('serwer');
      const q = p.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
    }
  } catch (e) { /* brak */ }
  if (adresWbudowany() && Pamiec.get('serwer', '') && Pamiec.get('serwer', '') !== adresWbudowany()) {
    // urządzenie łączyło się wcześniej z innym adresem – stara sesja nie zadziała
    ['token', 'rola', 'uczniowie', 'rzeczy', 'weekend'].forEach(k => Pamiec.del(k));
    Stan.token = null; Stan.uczniowie = []; Stan.rzeczy = [];
    Pamiec.set('serwer', adresWbudowany());
  }
  indeksuj();
  if (!adresSerwera()) return pokazKonfiguracje();
  if (!Stan.token) return pokazLogowanie();
  if (Stan.rola === 'panel' && Pamiec.get('widok', 'panel') === 'panel') pokazPanel();
  else pokazSkaner();
}

const Kamera = {
  strumien: null, wideo: null, detektor: null, dekoduje: false, zajety: false, ostatnia: 0, plotno: null, ctx: null, naKod: null, gen: 0, tryb: null,
  /** Włącza kamerę (raz – strumień zostaje, aż urządzenie przestanie być stanowiskiem). */
  async wlacz() {
    const tryb = Pamiec.get('kamera', 'user');
    if (this.strumien && this.tryb === tryb && this.strumien.getTracks().some(t => t.readyState === 'live')) return this.strumien;
    this.zatrzymajStrumien();
    if (!window.isSecureContext) throw new Error('Kamera działa tylko na stronie https (np. GitHub Pages).');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Ta przeglądarka nie udostępnia kamery.');
    if (!this.uruchamianie) {
      this.uruchamianie = (async () => {
        await this.przygotujDekoder();
        const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: tryb }, width: { ideal: 1280 }, height: { ideal: 720 } } });
        this.strumien = s; this.tryb = tryb;
        return s;
      })().finally(() => { this.uruchamianie = null; });
    }
    return this.uruchamianie;
  },
  /** Podłącza strumień do elementu <video> na ekranie podpisu i zaczyna szukać kodów. */
  async podlacz(wideo) {
    const gen = ++this.gen;
    const s = await this.wlacz();
    if (gen !== this.gen || !document.body.contains(wideo)) return false;
    this.wideo = wideo;
    wideo.srcObject = s;
    wideo.setAttribute('playsinline', '');
    wideo.muted = true;
    await wideo.play().catch(() => {});
    if (gen !== this.gen) return false;
    this.dekoduje = true;
    this.petla();
    return true;
  },
  odlacz() { this.gen++; this.dekoduje = false; if (this.raf) cancelAnimationFrame(this.raf); this.wideo = null; },
  async przygotujDekoder() {
    if (this.detektor || window.jsQR) return;
    if ('BarcodeDetector' in window) {
      try {
        const f = await window.BarcodeDetector.getSupportedFormats();
        if (f.indexOf('qr_code') >= 0) { this.detektor = new window.BarcodeDetector({ formats: ['qr_code'] }); return; }
      } catch (e) { /* przejdź do jsQR */ }
    }
    for (const src of JSQR_ZRODLA) {
      try { await zaladujSkrypt(src); if (window.jsQR) return; } catch (e) { /* następne źródło */ }
    }
    throw new Error('Nie udało się wczytać modułu rozpoznawania kodów QR – sprawdź internet.');
  },
  petla() {
    if (!this.dekoduje) return;
    const t = performance.now();
    if (!this.zajety && t - this.ostatnia >= 160 && this.wideo && this.wideo.readyState >= 2) {
      this.ostatnia = t;
      this.zajety = true;
      this.skanuj().catch(() => {}).then(() => { this.zajety = false; });
    }
    this.raf = requestAnimationFrame(() => this.petla());
  },
  async skanuj() {
    const v = this.wideo;
    if (!v) return;
    let tekst = null;
    if (this.detektor) {
      const wynik = await this.detektor.detect(v);
      if (wynik && wynik.length) tekst = wynik[0].rawValue;
    } else if (window.jsQR) {
      const vw = v.videoWidth, vh = v.videoHeight;
      if (!vw || !vh) return;
      const sk = Math.min(1, 720 / Math.max(vw, vh));
      const w = Math.round(vw * sk), h = Math.round(vh * sk);
      if (!this.plotno) { this.plotno = document.createElement('canvas'); this.ctx = this.plotno.getContext('2d', { willReadFrequently: true }); }
      this.plotno.width = w; this.plotno.height = h;
      this.ctx.drawImage(v, 0, 0, w, h);
      const obraz = this.ctx.getImageData(0, 0, w, h);
      const kod = window.jsQR(obraz.data, w, h, { inversionAttempts: 'attemptBoth' });
      if (kod && kod.data) tekst = kod.data;
    }
    if (tekst && this.dekoduje && this.naKod) this.naKod(tekst);
  },
  zatrzymajStrumien() {
    if (this.strumien) { this.strumien.getTracks().forEach(t => t.stop()); this.strumien = null; }
  },
  stop() {
    this.odlacz();
    this.zatrzymajStrumien();
  }
};

// czytnik USB (QR / RFID) działa jak klawiatura: wpisuje kod i naciska Enter
const Czytnik = { bufor: '', ostatni: 0 };
document.addEventListener('keydown', e => {
  if (Stan.widok !== 'skaner') return;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable)) return;
  const t = Date.now();
  if (t - Czytnik.ostatni > 800) Czytnik.bufor = '';
  Czytnik.ostatni = t;
  if (e.key === 'Enter') {
    const kod = Czytnik.bufor.trim();
    Czytnik.bufor = '';
    if (kod.length >= 3) { e.preventDefault(); obsluzKod(kod, 'czytnik'); }
    return;
  }
  if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) Czytnik.bufor += e.key;
});

const Owca = { bufor: null, laduje: null, gra: false };
function zaladujOwce() {
  if (Owca.bufor || Owca.laduje || !Stan.audio || DZWIEK_OWCA.indexOf('@@') >= 0) return Owca.laduje;
  try {
    const bin = atob(DZWIEK_OWCA);
    const bajty = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bajty[i] = bin.charCodeAt(i);
    Owca.laduje = new Promise((ok, zle) => Stan.audio.decodeAudioData(bajty.buffer, ok, zle))
      .then(b => { Owca.bufor = b; return b; })
      .catch(() => null)
      .finally(() => { Owca.laduje = null; });
  } catch (e) { Owca.laduje = null; }
  return Owca.laduje;
}
/** Gra zawsze (niezależnie od „Dźwięku przy skanowaniu”), żeby nie dało się jej wyciszyć w menu tabletu. */
async function owca() {
  try {
    odblokujDzwiek();
    const ctx = Stan.audio;
    if (!ctx) return;
    const buf = Owca.bufor || await zaladujOwce();
    if (!buf) { piknij(false); return; }
    if (Owca.gra) return;                 // już beczy – nie nakładamy drugiego
    Owca.gra = true;
    const src = ctx.createBufferSource(), g = ctx.createGain();
    g.gain.value = 1;
    src.buffer = buf;
    src.connect(g); g.connect(ctx.destination);
    src.onended = () => { Owca.gra = false; };
    src.start();
    window.__owca = (window.__owca || 0) + 1;   // licznik do testów
  } catch (e) { Owca.gra = false; }
}
function piknij(dobrze) {
  if (!Pamiec.get('dzwiek', true)) return;
  try {
    odblokujDzwiek();
    const ctx = Stan.audio;
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = dobrze ? 1175 : 220;
    const t0 = ctx.currentTime, dl = dobrze ? 0.14 : 0.35;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dl);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dl + 0.05);
  } catch (e) { /* brak dźwięku */ }
}
async function wlaczWakeLock() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible' && !Stan.wakeLock) {
      Stan.wakeLock = await navigator.wakeLock.request('screen');
      Stan.wakeLock.addEventListener('release', () => { Stan.wakeLock = null; });
    }
  } catch (e) { Stan.wakeLock = null; }
}
function zwolnijWakeLock() {
  try { if (Stan.wakeLock) Stan.wakeLock.release(); } catch (e) { /* brak */ }
  Stan.wakeLock = null;
}

function pokazSkaner() {

  Stan.widok = 'skaner';

  $('#aplikacja').innerHTML = `<div class="st">
    <header class="st-gora">

    <footer class="st-stopka" id="st-stopka"></footer>
    ${stopkaAutora(true)}
  </div>`;
  $('#aplikacja').onclick = e => {
    const b = e.target.closest('[data-a],[data-zak]');
    if (!b) return;
    odblokujDzwiek();
    if (b.dataset.zak) { St.zakladka = b.dataset.zak; Pamiec.set('st_zakladka', St.zakladka); rysujStanowisko(); return; }
    const a = b.dataset.a;
    if (a === 'menu') pokazMenuStanowiska();
    else if (a === 'wychodze') startWyjscie();
    else if (a === 'wracam') startWracam();
    else if (a === 'dom') startDom();
    else if (a === 'weekend') startWeekend();
    else if (a === 'pralnia') startRzecz('pralnia');
    else if (a === 'lodowki') ekranSiatki('lodowka');
    else if (a === 'aktywnosci') ekranSiatki('aktywnosc');
  };
  Kamera.naKod = t => obsluzKod(t, 'qr');
  rysujStanowisko();
  wlaczWakeLock();
  const zegar = () => {
    const z = $('#st-zegar');
    if (z) z.textContent = opisDniaDl(ymd(teraz())) + ' · ' + godz(teraz());
    const d = $('#warstwa .ekr-duch span');
    if (d) d.textContent = opisDniaDl(ymd(teraz())) + ' · ' + godz(teraz());
  };
  zegar();
  Stan.timery.push(setInterval(zegar, 1000));
  Stan.timery.push(setInterval(() => { if (document.visibilityState === 'visible') odswiezStan(true); }, ODSWIEZANIE_SKANER_MS));
  Stan.timery.push(setInterval(() => { if (!St.ekran) odswiezStanowisko(); }, 30000));
  odswiezStan(true);
  wyslijKolejke();
  Kamera.wlacz().catch(() => { /* błąd pokażemy na ekranie podpisu */ });
}

function tresciMojInternat() {

  const kafel = (a, ik, tytul, pod, chip, jasny) => `<button class="kafel ${jasny ? 'jasny' : ''}" data-a="${a}"><span class="ik">${ikona(ik, 2)}</span>

  const chipAkt = '<span class="ch">' + (aktW ? aktW + ' z ' + akt.length + ' ' + liczbaMnoga(aktW, 'wydana', 'wydane', 'wydanych') : 'wszystkie wolne') + '</span>';

/** Zgł. 2: trzy zasady, czytelnie; po godzinie wydawania pierwszy wiersz na czerwono. */
function zasadyMojInternat(po22) {
  const s = Stan.ustawienia;
  const od = s.wydawanieOd !== null && s.wydawanieOd !== undefined ? godzMin(s.wydawanieOd) : null;
  const doG = godzWydawaniaDo();
  const kiedy = od && doG ? '<b>od ' + esc(od) + ' do ' + esc(doG) + '</b>' : doG ? '<b>do ' + esc(doG) + '</b>' : od ? '<b>od ' + esc(od) + '</b>' : '<b>o każdej porze</b>';
  const pierwszy = po22 && doG
    ? `<div class="w cz">${ikona('zegar', 2.2)}<span><b>Po ${esc(doG)} nie wydajemy</b> kluczy ani rzeczy. Oddać możesz zawsze.</span></div>`
    : `<div class="w">${ikona('zegar', 2.2)}<span>Wydajemy ${kiedy}. Oddać możesz o każdej porze.</span></div>`;
  return `<div class="st-zasady"><div class="tyt">Zasady – klucze i rzeczy</div>${pierwszy}
    <div class="w">${ikona('osoba', 2.2)}<span>Oddaje zawsze <b>ta sama osoba, która wzięła</b> – podpisuje się swoim kodem QR.</span></div>
    <div class="w">${ikona('wyjscie', 2.2)}<span>Z kluczem albo rzeczą na stanie <b>nie wyjdziesz z internatu</b> ani nie wyjedziesz do domu – najpierw oddaj.</span></div></div>`;
}

function odswiezWskaznik() {
  const s = $('#sk-siec');
  if (!s) return;
  const n = Stan.kolejka.length;
  if (n) { s.className = 'siec ' + (Stan.bladSieci ? 'brak' : 'czeka'); s.textContent = (Stan.bladSieci ? 'Brak internetu – ' : 'Zapisywanie – ') + 'czeka: ' + n; }
  else if (Stan.bladSieci) { s.className = 'siec brak'; s.textContent = 'Brak połączenia'; }
  else if (Stan.ostatniKontakt) { s.className = 'siec ok'; s.textContent = 'Połączono'; }
  else { s.className = 'siec'; s.textContent = 'Łączenie…'; }
}

// ── ostatnie podpisy na tym stanowisku (widać je w ustawieniach stanowiska)
function dodajOstatnie(w) {
  Stan.ostatnie.unshift(w);
  Stan.ostatnie = Stan.ostatnie.slice(0, 15);
  Pamiec.set('ostatnie', Stan.ostatnie);
}
function oznaczOstatnie(uid, stan) {
  const w = Stan.ostatnie.find(x => x.uid === uid);
  if (w) { w.stan = stan; Pamiec.set('ostatnie', Stan.ostatnie); }
}

// ═════════════ warstwa kroków ═════════════
function duch() {
  return `<div class="ekr-duch"><div class="n"><b>${esc(Stan.nazwa)}</b><span>${esc(opisDniaDl(ymd(teraz())) + ' · ' + godz(teraz()))}</span></div><div>${Stan.bladSieci ? 'Brak połączenia' : 'Połączono'}</div></div>`;
}
function pig(tekst, kolor, ciemna) { return `<span class="pig p-${kolor} ${ciemna ? 'ciemna' : ''}">${tekst}</span>`; }
function gora(wstecz, opis, pigulka) {
  return `<div class="dlg-gora">${wstecz ? `<button class="wstecz" data-f="${wstecz}">${ikona('wstecz', 2.4)}<span>Wstecz</span></button>` : ''}<div class="opis">${opis || ''}</div>${pigulka || ''}</div>`;
}
function oknoKroku(goraHtml, tresc, dol, klasa) {
  return `<div class="ekr"><div class="ekr-duch-m">${duch()}</div><div class="ekr-srodek"><div class="dlg ${klasa || ''}" role="dialog" aria-modal="true">${goraHtml}${tresc}${dol ? '<div class="dlg-dol">' + dol + '</div>' : ''}</div></div></div>`;
}
/** Pokazuje ekran kroku. Zwraca element, do którego podpinamy obsługę kliknięć. */
function pokazEkran(html, nazwa, czasBezczynnosci) {
  const w = $('#warstwa');
  Kamera.odlacz();
  w.innerHTML = html;
  St.ekran = nazwa;
  St.czasBezczynnosci = czasBezczynnosci || BEZCZYNNOSC_OKNO_MS;
  ruch();
  const el = w.firstElementChild;
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-f]');
    if (b && b.dataset.f === 'zamknij') { e.stopImmediatePropagation(); zamknijFlow(); }
  });
  return el;
}
function ruch() {
  clearTimeout(St.bezczynnosc);
  if (!St.ekran) return;
  St.bezczynnosc = setTimeout(() => { if (St.ekran && !$('#nakladki .nakladka')) zamknijFlow(); else ruch(); }, St.czasBezczynnosci || BEZCZYNNOSC_OKNO_MS);
}
['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => { if (St.ekran) ruch(); }, true));
function zamknijFlow() {
  Kamera.odlacz();
  clearTimeout(St.bezczynnosc);
  St.flow = null;
  St.ekran = null;
  $$('#nakladki .nakladka.wyszukiwarka').forEach(n => zamknijNakladke(n));
  const w = $('#warstwa');
  if (w) w.innerHTML = '';
  if (Stan.widok === 'skaner') odswiezStanowisko();
}

// ═════════════ WYCHODZĘ ═════════════
function startWyjscie() { St.flow = { typ: 'WYJSCIE' }; ekranWyjCel(); }

function ekranWyjCel() {
  const f = St.flow;
  const el = pokazEkran(oknoKroku(gora('zamknij', '', pig('Wychodzę · krok 1 z 3', 'wyj')),
    `<h2>Dokąd wychodzisz?</h2>
     <div class="siatka-opcji">${CELE.map(c => `<button class="opcja ${f.cel === c.n ? 'wyb' : ''}" data-cel="${esc(c.n)}"><b>${esc(c.n)}</b><small>${esc(c.p)}</small></button>`).join('')}</div>`,
    `<span class="lewo">Na końcu podpiszesz się kodem QR.</span><button class="btn-anuluj" data-f="zamknij">Anuluj</button>`), 'wyj-cel');
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-cel]');
    if (!b) return;
    f.cel = b.dataset.cel;
    ekranWyjKiedy();
  });
}

/** Zgł. 14: uczeń wybiera tylko „Wracam przed 21:00”. Powrót po 21:00 – wyłącznie przez wychowawcę (zgoda przed wyjściem). */
function ekranWyjKiedy() {
  const f = St.flow;
  const t = teraz() - (teraz() % 60000);
  const limit = terminPowrotu(t);
  const g = limit !== null ? godz(limit) : null;
  const po = limit !== null && t >= limit;
  const przycisk = `<button class="opcja zwiersz pomar ${po ? 'wyl' : ''}" data-f="przed" ${po ? 'aria-disabled="true"' : ''}><span class="ik">${ikona('zegar', 2.2)}</span>
      <span class="tr"><b style="font-size:clamp(1.5rem,2.8vw,2rem)">${g ? 'Wracam przed ' + esc(g) : 'Wracam dziś'}</b><small style="font-size:1.1rem">${po ? 'jest już po ' + esc(g) : 'bez dodatkowej zgody'}</small></span>${po ? '' : ikona('dalej', 2.6)}</button>`;
  const ramka = g ? `<div class="czerwony" style="cursor:default"><span class="ik">${ikona('wychowawca', 2.2)}</span>
      <span class="tr"><b style="font-size:1.5rem">Powrót po ${esc(g)}</b><b style="font-size:1.2rem;color:#4a1010">Zgłoś się do wychowawcy.</b>
      <span style="font-size:1.05rem">Rodzic albo trener musi potwierdzić, <b>zanim wyjdziesz</b>. Wyjście zapisze wychowawca.</span></span></div>` : '';
  const el = pokazEkran(oknoKroku(gora('wstecz', 'cel: <b>' + esc(f.cel) + '</b>', pig('Wychodzę · krok 2 z 3', 'wyj')),
    `<h2>Kiedy wracasz?</h2><div class="siatka-opcji ${g ? 'dwie' : ''}" style="${g ? '' : 'grid-template-columns:1fr'}">${przycisk}${ramka}</div>`,
    `<span class="lewo">${po ? 'Po ' + esc(g) + ' wyjście zapisuje tylko wychowawca.' : 'Na końcu podpiszesz się kodem QR.'}</span><button class="btn-anuluj" data-f="zamknij">Anuluj</button>`), 'wyj-kiedy');
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    if (b.dataset.f === 'wstecz') return ekranWyjCel();
    if (b.dataset.f !== 'przed') return;
    if (po) { owca(); toast('Jest już po ' + g + ' – wyjście zapisuje tylko wychowawca.', 'blad', 5000); return; }
    f.powrot = limit;
    f.zgoda = ''; f.uwaga = '';
    ekranPodpis();
  });
}

// ═════════════ WRACAM ═════════════
function startWracam() { St.flow = { typ: 'WEJSCIE' }; ekranPodpis(); }

// ═════════════ WYJAZD DO DOMU ═════════════
function startDom() {
  St.flow = { typ: 'DOM' };
  if (czyDzienWeekendowy(ymd(teraz()))) ekranDomWeekend(); else ekranDomTydzien();
}
function najblizszyDzien(odDnia, dzien) { let d = odDnia; for (let i = 0; i < 8; i++) { if (dzienTyg(d) === dzien) return d; d = dodajDni(d, 1); } return d; }

function ekranDomWeekend() {
  const f = St.flow;
  f.rodzaj = 'weekend';
  const dzis = ymd(teraz());
  const nd = najblizszyDzien(dzis, 7);
  const pn = najblizszyDzien(dodajDni(dzis, 1), 1);
  const el = pokazEkran(oknoKroku(gora('zamknij', 'Wyjazd do domu', pig('krok 1 z 2', 'dom')),
    `<div class="wiersz-h"><h2>Kiedy wracasz do internatu?</h2><span class="pig p-wr">Weekend – wystarczy zaznaczyć, bez zgód</span></div>
     <div class="siatka-opcji dwie">
       <button class="opcja nieb mocna zwiersz" data-d="${nd}"><span class="ik">${ikona('ksiezyc', 2.2)}</span><span class="tr"><b>${nd === dzis ? 'Dziś wieczorem' : 'W niedzielę wieczorem'}</b><small>${esc(opisDniaDl(nd))}</small></span>${ikona('dalej', 2.6)}</button>
       <button class="opcja nieb mocna zwiersz" data-d="${pn}"><span class="ik">${ikona('szkola', 2.2)}</span><span class="tr"><b>W poniedziałek po szkole</b><small>${esc(opisDniaDl(pn))}</small></span>${ikona('dalej', 2.6)}</button>
     </div>
     <button class="opcja nieb" data-f="inny" style="min-height:0;flex-direction:row;align-items:center;gap:12px;padding:10px 16px"><span style="flex:1;display:flex;flex-direction:column"><b style="font-size:1.1rem">Wracasz w inny dzień? (np. we wtorek)</b><small style="font-weight:700">Wybierz dzień powrotu z listy</small></span>${ikona('dalej', 2.6)}</button>
     <div class="dwie-kol"><div class="info-sz"><b>Jedziesz prosto ze szkoły?</b> Zaznacz wyjazd rano, kiedy wychodzisz z internatu.</div>
       <div class="info-sz"><b>Wracasz w poniedziałek po szkole?</b> „Wracam” podpisz dopiero po przyjściu.</div></div>`,
    `<span class="lewo">Dotknij dnia powrotu – potem podpis kodem QR.</span><button class="btn-anuluj" data-f="zamknij">Anuluj</button>`), 'dom-weekend');
  el.addEventListener('click', e => {

    if (!b) return;

  });
}


function ekranDomDzien() {
  const f = St.flow;
  f.rodzaj = 'weekend';
  const dzis = ymd(teraz());
  const pn = najblizszyDzien(dodajDni(dzis, 1), 1);
  const dni = [dodajDni(pn, 1), dodajDni(pn, 2), dodajDni(pn, 3)];
  const inny = f.powrotData && dni.indexOf(f.powrotData) < 0 && f.powrotData > pn;
  const el = pokazEkran(oknoKroku(gora('wstecz', 'Wyjazd do domu', pig('krok 1 z 2', 'dom')),
    `<h2>W który dzień wracasz do internatu?</h2>
     <div class="siatka-opcji cztery">${dni.map(d => `<button class="opcja nieb ${f.powrotData === d ? 'wyb' : ''}" data-d="${d}"><b>${esc(DNI[dzienTyg(d) - 1] + ' ' + dzienMies(d))}</b><small>po szkole</small></button>`).join('')}
       <button class="opcja nieb przer ${inny ? 'wyb' : ''}" data-f="kalendarz"><b>${inny ? esc(opisDniaSr(f.powrotData)) : 'Inny dzień…'}</b><small>${inny ? esc(poraPowrotu(f.powrotData)) : 'wybierz z kalendarza'}</small></button></div>
     <div id="dd-kal" class="${f.kal ? '' : 'ukryte'}"><div class="dni-chips">${kolejneDni(dodajDni(pn, 4), 18).map(d => `<button class="dzien-chip ${f.powrotData === d ? 'wyb' : ''}" data-d="${d}">${esc(opisDniaKr(d))}<small>${esc(poraPowrotu(d) || 'sobota')}</small></button>`).join('')}</div></div>`,
    `<button class="btn-anuluj" data-f="zamknij">Anuluj</button><button class="btn-dalej" data-f="dalej" ${f.powrotData && f.powrotData > pn ? '' : 'disabled'}>Dalej – podpis kodem QR</button>`), 'dom-dzien');
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-d],[data-f]');
    if (!b || b.disabled) return;
    if (b.dataset.f === 'wstecz') return ekranDomWeekend();
    if (b.dataset.f === 'kalendarz') { f.kal = !f.kal; return ekranDomDzien(); }
    if (b.dataset.d) { f.powrotData = b.dataset.d; return ekranDomDzien(); }
    if (b.dataset.f === 'dalej') { f.zDnia = true; ekranPodpis(); }
  });
}
function kolejneDni(od, ile) { const w = []; let d = od; for (let i = 0; i < ile; i++, d = dodajDni(d, 1)) w.push(d); return w; }

function ekranDomTydzien() {
  const f = St.flow;
  f.rodzaj = 'tydzien';
  const dzis = ymd(teraz());
  const tel = Stan.ustawienia.telefon || '';
  f.powrotData = '';                     // dzień powrotu wpisuje wychowawca w panelu, gdy będzie wiadomo
  const gotowe = f.potwierdzenie && f.powod;
  const el = pokazEkran(oknoKroku(gora('zamknij', '<b style="font-size:1.25rem">Wyjazd do domu poza weekendem</b>', pig('krok 1 z 2', 'dom')),
    `<div class="ramka-cz">
       <div class="t">${ikona('uwaga', 2.2)} Dziś ${esc(DNI[dzienTyg(dzis) - 1])} – potrzebne potwierdzenie rodzica</div>
       <div style="display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.95rem;align-items:center"><span>Rodzic potwierdza wyjazd <b>SMS-em lub e-mailem</b> albo <b>odbiera Cię osobiście</b>.</span>
         ${tel ? `<span class="nowrap">Numer dla rodziców: <span class="numer">${esc(tel)}</span></span>` : ''}</div>
       <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b style="margin-right:4px">Jak rodzic potwierdził?</b>
         ${POTWIERDZENIA.map(z => `<button type="button" class="wybor-cz ${f.potwierdzenie === z.w ? 'wyb' : ''}" data-p="${esc(z.w)}">${f.potwierdzenie === z.w ? ikona('ok', 3) : ''}<span>${esc(z.przycisk)}</span></button>`).join('')}</div>
     </div>
     <div><h3 style="margin-bottom:6px">Powód</h3><div class="dni-chips">${POWODY.map(p => `<button type="button" class="dzien-chip ${f.powod === p ? 'wyb' : ''}" data-pw="${esc(p)}" style="flex-direction:row">${esc(p)}</button>`).join('')}</div></div>
     <div class="zolty"><span class="ik">${ikona('wychowawca', 2.2)}</span><span class="tr"><span><b>Zgłoś to wychowawcy przy drzwiach.</b> Powiedz, że rodzic potwierdził wyjazd i <b>jak</b> – SMS-em, e-mailem czy osobiście.</span></span></div>`,
    `<span class="lewo">${gotowe ? '' : 'Zaznacz: jak rodzic potwierdził i powód.'}</span><button class="btn-anuluj" data-f="zamknij">Anuluj</button><button class="btn-dalej" data-f="dalej" ${gotowe ? '' : 'disabled'}>Dalej – podpis kodem QR</button>`), 'dom-tydzien');
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-p],[data-pw],[data-f]');
    if (!b || b.disabled) return;
    if (b.dataset.p) { f.potwierdzenie = b.dataset.p; return ekranDomTydzien(); }
    if (b.dataset.pw) { f.powod = b.dataset.pw; return ekranDomTydzien(); }
    if (b.dataset.f === 'dalej') ekranPodpis();
  });
}

// ═════════════ MÓJ INTERNAT ═════════════
function startWeekend() {
  const w = Stan.weekend;
  if (!w) { toast('Brak danych o weekendzie – poczekaj na połączenie z serwerem.', 'blad'); return; }
  St.flow = { typ: 'WEEKEND_ZAPIS', weekend: w.piatek };
  if (teraz() > w.termin) return ekranWeekendZamkniete();
  ekranWeekend();
}
function terminZapisowTekst(w, dlugi) {
  const d = ymd(w.termin);
  return dlugi ? 'do ' + DNI_DOP[dzienTyg(d) - 1] + ' ' + dzienMies(d) + ', ' + godz(w.termin) : DNI_KROTKO[dzienTyg(d) - 1] + ' ' + dzienMies(d) + ', ' + godz(w.termin);
}
function ekranWeekend() {
  const f = St.flow;
  const w = Stan.weekend;
  const pt = w.piatek, sob = dodajDni(pt, 1), nd = dodajDni(pt, 2);
  f.dniWyb = f.dniWyb || [];
  const el = pokazEkran(oknoKroku(gora('zamknij', '', pig('MÓJ INTERNAT · Weekend · krok 1 z 2', 'moj')),
    `<div class="wiersz-h"><h2>Zostaję w internacie: weekend ${esc(opisWeekendu(pt))}</h2><span class="pig p-zolta">zapisy ${esc(terminZapisowTekst(w, true))}</span></div>
     <h3>Jak długo zostajesz?</h3>
     <div class="siatka-opcji dwie">
       <button class="opcja fiol mocna zwiersz" data-o="caly"><span class="ik">${ikona('lozko', 2.2)}</span><span class="tr"><b style="font-size:1.6rem">Cały weekend</b><small>${esc(opisDniaKr(pt) + ' – ' + opisDniaKr(nd))}</small></span></button>
       <button class="opcja fiol zwiersz" data-o="sob"><span class="ik">${ikona('lozko', 2.2)}</span><span class="tr"><b style="font-size:1.6rem">Do soboty</b><small>${esc(opisDniaKr(pt) + ' – ' + opisDniaKr(sob))}</small></span></button>
     </div>
     <button class="opcja fiol przer" data-f="inaczej" style="min-height:0;padding:10px 16px"><b style="font-size:1.05rem">Inaczej – wybiorę dni (np. od soboty)</b></button>
     <div class="${f.inaczej ? '' : 'ukryte'}" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
       <div class="dni-chips">${[pt, sob, nd].map(d => `<button type="button" class="dzien-chip fiol ${f.dniWyb.indexOf(d) >= 0 ? 'wyb' : ''}" data-dz="${d}">${esc(opisDniaKr(d))}<small>${f.dniWyb.indexOf(d) >= 0 ? 'zostaję' : 'dotknij'}</small></button>`).join('')}</div>
       <button class="btn-dalej k-moj" data-f="dni" ${f.dniWyb.length ? '' : 'disabled'}>Dalej – podpis kodem QR</button></div>
     <div class="info-sz"><b>Bez zgody rodzica.</b> Zapis trafia do karty „Weekend w internacie” w arkuszu. Masz już zapis? Tutaj też się wypiszesz.</div>`,
    `<button class="btn-anuluj" data-f="wypisz" style="margin-right:auto">Wypisz mnie z weekendu</button><button class="btn-anuluj" data-f="zamknij">Anuluj</button>`), 'weekend');
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-o],[data-dz],[data-f]');
    if (!b || b.disabled) return;
    if (b.dataset.o === 'caly') { f.opis = 'cały weekend · ' + opisDniaKr(pt) + ' – ' + opisDniaKr(nd); return ekranPodpis(); }
    if (b.dataset.o === 'sob') { f.opis = 'do soboty · ' + opisDniaKr(pt) + ' – ' + opisDniaKr(sob); return ekranPodpis(); }
    if (b.dataset.f === 'inaczej') { f.inaczej = !f.inaczej; return ekranWeekend(); }
    if (b.dataset.dz) {
      const i = f.dniWyb.indexOf(b.dataset.dz);
      if (i >= 0) f.dniWyb.splice(i, 1); else f.dniWyb.push(b.dataset.dz);
      f.dniWyb.sort();
      return ekranWeekend();
    }
    if (b.dataset.f === 'dni') { f.opis = opisDniWeekendu(f.dniWyb, pt); return ekranPodpis(); }
    if (b.dataset.f === 'wypisz') { St.flow = { typ: 'WEEKEND_WYPIS', weekend: w.piatek }; return ekranPodpis(); }
  });
}
function opisDniWeekendu(dni, pt) {
  const sob = dodajDni(pt, 1), nd = dodajDni(pt, 2);
  const k = dni.join(',');
  if (k === [pt, sob, nd].join(',')) return 'cały weekend · ' + opisDniaKr(pt) + ' – ' + opisDniaKr(nd);
  if (k === [pt, sob].join(',')) return 'do soboty · ' + opisDniaKr(pt) + ' – ' + opisDniaKr(sob);
  if (k === [sob, nd].join(',')) return 'od soboty · ' + opisDniaKr(sob) + ' – ' + opisDniaKr(nd);
  return 'wybrane dni: ' + dni.map(opisDniaKr).join(', ');
}
function ekranWeekendZamkniete() {
  const w = Stan.weekend;
  const z = Stan.ustawienia.zapisyDo || { dzien: 4, min: 1320 };
  const el = pokazEkran(oknoKroku('',
    `<div style="display:flex;align-items:center;gap:14px"><span class="awatar" style="width:54px;height:54px;background:#b8860b;color:#fff">${ikona('zegar', 2.2)}</span>

/** ['100','101','102','103'] → „100–103”; ['1','2','3','4','8','9','10','14','16'] → „1–4, 8–10, 14, 16” */
function skrocPokoje(tokeny, zapas) {
  if (!tokeny || !tokeny.length) return zapas || '';
  const czyste = tokeny.every(t => /^\d+$/.test(t));
  if (!czyste) return zapas || tokeny.join(', ');
  const n = Array.from(new Set(tokeny.map(Number))).sort((a, b) => a - b);
  const wynik = [];
  for (let i = 0; i < n.length;) {
    let j = i;
    while (j + 1 < n.length && n[j + 1] === n[j] + 1) j++;
    wynik.push(j - i >= 2 ? n[i] + '–' + n[j] : n.slice(i, j + 1).join(', '));
    i = j + 1;
  }
  return wynik.join(', ');
}

}

function opisPodpisu(f) {

  } else if (f.typ === 'WEJSCIE') {
    o.kolor = 'wr'; o.pig = 'Wracam'; o.co = ''; o.tytul = 'Powrót do internatu';
    o.nota = 'Aplikacja pamięta Twoje wyjście – po podpisie zobaczysz, czy jesteś na czas.';
  } else if (f.typ === 'DOM') {
    o.kolor = 'dom'; o.co = ''; o.tytul = 'Wyjazd do domu';
    if (f.rodzaj === 'tydzien') {
      o.pig = 'Poza weekendem · krok 2 z 2';

      o.ramki.push('<div class="ramka-mala cz"><b>' + esc(p.ramka) + '</b></div>');
      o.ramki.push('<div class="ramka-mala zo"><b>Zgłoś to wychowawcy przy drzwiach.</b>' + (p.w === 'osobiście' ? '' : ' Powiedz, jak rodzic potwierdził.') + '</div>');
    } else {
      o.pig = 'Wyjazd do domu · krok 2 z 2';
      o.chipy.push(pig('powrót: ' + esc(opisPowrotuSr(f.powrotData)), 'dom'));
      o.chipy.push(pig('weekend – bez dodatkowych zgód', 'wr'));

  } else if (f.typ === 'POBRANIE' || f.typ === 'ZWROT') {
    const r = rzecz(f.rid);
    o.kolor = 'moj'; o.moj = true;
    o.pig = 'MÓJ INTERNAT · ' + esc(r.typ === 'lodowka' ? 'Lodówka ' + r.nr : r.typ === 'pralnia' ? 'Pralnia' : 'Aktywności');
    o.co = f.typ === 'POBRANIE' ? 'Pobranie' : 'Zwrot'; o.tytul = r.nazwa;
    if (f.typ === 'POBRANIE') {
      if (r.typ === 'lodowka') { o.chipy.push(pig('pokoje ' + esc(skrocPokoje(r.tokeny, r.pokoje)), 'moj')); o.nota = 'Aplikacja sprawdzi, czy Twój pokój należy do tej lodówki.'; }
      else { o.chipy.push(pig(r.typ === 'pralnia' ? 'klucz jest wolny' : 'wolne', 'wr')); o.nota = 'Zwrot podpiszesz swoim kodem QR – oddaje zawsze osoba, która wzięła.'; }
    } else {
      o.chipy.push(pig('oddać może tylko: ' + esc(r.ma ? r.ma.u + ' · pok. ' + r.ma.p : '–'), 'zolta'));
      o.nota = f.zBlokady ? 'Po zwrocie możesz zacząć ' + (f.zBlokady.typ === 'WYJSCIE' ? 'wyjście' : 'wyjazd') + ' od nowa.' : 'Kod innej osoby – zwrot się nie zapisze.';

    o.chipy.push(pig('weekend ' + esc(opisWeekendu(f.weekend)), 'moj'));
    o.nota = 'Wypis trafi do karty „Weekend w internacie”.';
  }
  return o;
}
function wsteczZPodpisu() {
  const f = St.flow;
  if (!f) return zamknijFlow();
  if (f.typ === 'WYJSCIE') return ekranWyjKiedy();
  if (f.typ === 'DOM') return f.rodzaj === 'tydzien' ? ekranDomTydzien() : f.zDnia ? ekranDomDzien() : ekranDomWeekend();
  if (f.typ === 'WEEKEND_ZAPIS') return ekranWeekend();
  if (f.typ === 'WEEKEND_WYPIS') return startWeekend();
  if (f.typ === 'ZWROT' && f.zBlokady) { const u = Stan.poId.get(f.zBlokady.uczen); const rz = u ? rzeczyUcznia(u.id) : []; if (u && rz.length) { St.flow = f.zBlokady.flow; return ekranBlokada(u, rz, f.zBlokady.flow); } }

  if (f.siatka) return ekranSiatki(f.siatka);
  zamknijFlow();
}

function obsluzKod(tekst, sposob) {

  if (Skan.kod === kod && t - Skan.czas < 4000) { Skan.czas = t; return; }   // ten sam kod wciąż przed kamerą

  if (St.ekran !== 'podpis') {
    if (!St.potw && !$('#nakladki .nakladka')) { piknij(false); toast('Najpierw wybierz, co robisz – potem pokaż kod QR.', '', 3500); }

/** Uczeń się podpisał – sprawdzamy zasady i zapisujemy (albo pokazujemy, dlaczego nie). */
async function podpisz(u, sposob) {
  const f = St.flow;

        `<button class="btn-dalej k-ciem" data-f="zamknij">Zamknij</button>`, 'waski'), 'wyj-po-limicie');
      return;
    }
    const ostrz = [];
    if (f.typ === 'WYJSCIE' && u.s === 'OUT') ostrz.push(krotko(u) + ' ma już zapisane wyjście (od ' + kiedy(u.od) + (u.sz ? ', ' + u.sz : '') + ') – bez podpisu „Wracam”. Zapisać nowe wyjście?');

    if (f.typ === 'DOM' && u.s === 'HOME') ostrz.push(krotko(u) + ' jest już zapisany(-a) jako „w domu” (od ' + kiedy(u.od) + '). Zapisać wyjazd jeszcze raz?');
    if (ostrz.length && !(await potwierdz({ tytul: 'Sprawdź przed zapisem', tresc: ostrz, tak: 'Zapisz mimo to', nie: 'Anuluj' }))) return wznowPodpis();
    return zapiszAkcje(u, sposob);
  }
  if (f.typ === 'WEJSCIE') {

    return zapiszAkcje(u, sposob);
  }
  if (f.typ === 'ZWROT') {

    if (!r || !r.ma) { toast('Ta rzecz jest już oddana.', '', 4000); return zamknijFlow(); }
    if (r.ma.id !== u.id) { owca(); return ekranNieTen(r, u); }
    return zapiszAkcje(u, sposob);

}

function migawka(ev) {
  const m = { ev: ev };
  if (AKCJA_STATUS[ev.akcja]) { const u = Stan.poId.get(ev.id); m.u = u ? Object.assign({}, u) : null; }
  else if (ev.rzecz) { const r = rzecz(ev.rzecz); m.ma = r ? (r.ma ? Object.assign({}, r.ma) : null) : undefined; }

}

  }
}

/** Zgł. 6: kto z tego samego pokoju (dokładnie ten numer – 111A to nie 111B) jest już w internacie. */
function normPokoj(p) { return String(p == null ? '' : p).toUpperCase().replace(/\s+/g, ''); }
function wspolokatorzyWPokoju(u) {
  const p = normPokoj(u.p);
  if (!p) return [];
  return Stan.uczniowie.filter(x => x.id !== u.id && x.s === 'IN' && normPokoj(x.p) === p)
    .sort((a, b) => (a.od || 0) - (b.od || 0));
}
/** „A”, „A i B”, „A, B i C” */
function listaImion(t) { return t.length < 2 ? t.join('') : t.slice(0, -1).join(', ') + ' i ' + t[t.length - 1]; }
function zamknijPotwierdzenie2(wyslij) {

  clearInterval(St.potwOdl);

  if (!p) return;

function cofnij() {

  if (!p) return;
  const i = Stan.kolejka.findIndex(e => e.uid === p.uid);
  if (i < 0) { toast('Za późno – zapis został już wysłany.', 'blad'); zamknijPotwierdzenie2(false); return; }
  Stan.kolejka.splice(i, 1);
  zapiszKolejke();
  przywroc(p.mig);
  Stan.ostatnie = Stan.ostatnie.filter(x => x.uid !== p.uid);
  Pamiec.set('ostatnie', Stan.ostatnie);
  const flow = p.flow;
  St.potw = null;
  clearTimeout(St.potwTimer);
  clearInterval(St.potwOdl);
  p.el.remove();
  toast('Cofnięto – nic się nie zapisało.', 'ok');
  St.flow = flow;
  Skan.czas = Date.now();
  ekranPodpis(true);
}

function priorytet(u) {
  if (spozniony(u)) return 0;
  if (u.s === 'OUT') return 1;
  if (czekamy(u)) return 2;
  if (u.s === 'HOME') return 3;
  return 4;
}
function listaStanu() {
  const q = norm(Stan.filtrTekst);
  const f = Stan.filtr;
  return Stan.uczniowie.filter(u => {
    if (f === 'LATE' && !spozniony(u)) return false;
    if (f === 'CZEKA' && !czekamy(u)) return false;
    if ((f === 'IN' || f === 'HOME') && u.s !== f) return false;
    return !q || norm([u.n, u.i, u.i, u.n, u.k, 'pokoj ' + u.p, u.p, u.nt, u.sz].join(' ')).indexOf(q) >= 0;
  }).sort((a, b) => {
    const s = Stan.sortowanie;
    if (s === 'status') return priorytet(a) - priorytet(b) || (a.s === 'OUT' && b.s === 'OUT' ? (a.pp || 0) - (b.pp || 0) : 0) || porownaj(a.i, b.i) || porownaj(a.n, b.n);
    if (s === 'grupa') return porownajWiersze({ u: a.n + ' ' + a.i, p: a.p, g: a.g }, { u: b.n + ' ' + b.i, p: b.p, g: b.g }, 'grupa');
    if (s === 'pokoj') return porownaj(a.p, b.p) || porownaj(a.i, b.i);
    if (s === 'czas') return (b.od || 0) - (a.od || 0);
    return porownaj(a.n, b.n) || porownaj(a.i, b.i);
  });
}
function szczegolyUcznia(u) {
  const czesci = [];
  if (u.s === 'OUT') {
    if (u.sz) czesci.push(esc(u.sz));
    if (u.pp) czesci.push('wróci do <b>' + esc(godzinaZDniem(u.pp, u.od)) + '</b>');
    let h = czesci.join(' · ');
    if (u.zg) h += ' <span class="chip s-NOTA">zgoda: ' + esc(u.zg) + '</span>';
    return h;
  }
  if (u.s === 'HOME') {
    if (u.sz) czesci.push(esc(u.sz));
    if (u.pp) czesci.push('powrót <b>' + esc(opisPowrotuKr(ymd(u.pp))) + '</b>' + (u.pz ? '' : ' <span class="szary">(wg ucznia)</span>'));
    else czesci.push('powrót: nie podano');
    let h = czesci.join(' · ');
    if (u.zg) h += ' <span class="szary">(' + esc(u.zg) + ')</span>';
    return h;
  }
  const rz = rzeczyUcznia(u.id);
  return rz.length ? '<span class="chip s-MOJ bez">ma: ' + esc(rz.map(r => malaLitera(r.nazwa)).join(', ')) + '</span>' : '';
}
function uwagiUcznia(u) {
  const w = [];
  if (spozniony(u)) w.push(u.s === 'HOME' ? '<span class="late-zn">nie wrócił(a) z domu</span>' : '<span class="late-zn">spóźnienie ' + esc(czasTrwania(minutySpoznienia(u))) + '</span>');
  if (u.nt) w.push('<span class="nota">' + esc(u.nt) + (u.ntk ? ' <span class="nota-kto">– ' + esc(u.ntk) + '</span>' : '') + '</span>');
  return w.join(' ');
}
function rysujWierszeStanu() {
  const c = liczniki();
  const fl = $('#st-filtry');

    const liczba = { wszyscy: c.razem, IN: c.IN, CZEKA: c.CZEKA, HOME: c.HOME, LATE: c.LATE };
