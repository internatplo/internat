      <td>${pok(u.p)}</td>${zGrupa ? '<td>' + grp(u.g) + '</td>' : ''}${zKlasa ? '<td class="tylko-szeroki">' + esc(u.k) + '</td>' : ''}
      <td><span class="chip s-${u.s}">${esc(STATUS_NAZWA[u.s])}</span></td>
      <td class="tylko-szeroki">${u.od ? esc(kiedy(u.od)) + '<div class="szary">' + esc(czasTrwania((teraz() - u.od) / 60000)) + ' temu</div>' : '<span class="szary">—</span>'}</td>

/** 22:30, a gdy to już blisko – za godzinę (pełne kwadranse). */
function domyslnaGodzinaPo21() {
  let ms = godzinaWieczoru('22:30');
  if (!ms || ms < teraz() + 30 * 60000) { const t = teraz() + 60 * 60000; ms = t - (t % (15 * 60000)) + 15 * 60000; }
  return godz(ms);
}
/** „22:30” → ms wieczoru, do którego należy teraz (godziny przed 5:00 to już następny dzień, po północy). */
function godzinaWieczoru(hhmm) {
  const m = /^(\d{1,2}):(\d{2})/.exec(hhmm || '');
  if (!m) return null;
  const min = Number(m[1]) * 60 + Number(m[2]);
  let dzien = ymd(teraz());
  if (czesciCzasu(teraz()).min < GRANICA_DOBY) dzien = dodajDni(dzien, -1);
  return msZDnia(min < GRANICA_DOBY ? dodajDni(dzien, 1) : dzien, min);
}

// ── zakładka: powroty po 21:00
function zakresOkresu(okres) {
  const dzis = ymd(teraz());
  if (okres === 'tydzien') return { od: dodajDni(dzis, 1 - dzienTyg(dzis)), do: dzis, nazwa: 'w tym tygodniu' };
  if (okres === 'rok') {
    const y = Number(dzis.slice(0, 4)), m = Number(dzis.slice(5, 7));
    const start = (m >= 9 ? y : y - 1) + '-09-01';
    return { od: start, do: dzis, nazwa: 'w roku szkolnym' };
  }
  const m = Number(dzis.slice(5, 7));
  return { od: dzis.slice(0, 8) + '01', do: dzis, nazwa: 'w ' + MIESIACE_MIEJ[m - 1] };
}

async function zaladujHistorie() {
  const h = Stan.hist;
  if (!h) return;
  if (!h.od || !h.do) { h.blad = 'Wybierz daty.'; rysujWynikiHistorii(); return; }
  if (h.do < h.od) { h.blad = 'Data „do” jest wcześniejsza niż „od”.'; rysujWynikiHistorii(); return; }
  h.laduje = true; h.blad = '';
  rysujWynikiHistorii();
  try {
    const d = await api('historia', { od: h.od, do: h.do, id: h.id ? Number(h.id) : '', rodzaj: h.rodzaj });
    if (!d.ok) throw new BladApi(d.blad || 'Nie udało się pobrać rejestru.', 'serwer');
    h.wpisy = d.wpisy || []; h.obciete = !!d.obciete;
  } catch (e) {
    if (e.rodzaj !== 'auth') h.blad = e.message;
  } finally {
    h.laduje = false;
    if (Stan.zakladka === 'historia') rysujWynikiHistorii();
  }
}

// ── kody QR (rysowanie)
function rysujQr(canvas, tekst, modul, margines) {
  const m = QRMacierz(tekst);
  const n = m.length;
  const rozmiar = (n + margines * 2) * modul;
  canvas.width = rozmiar; canvas.height = rozmiar;
  const g = canvas.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, rozmiar, rozmiar);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) g.fillRect((c + margines) * modul, (r + margines) * modul, modul, modul);
  return canvas;
}
function dopasujCzcionke(g, tekst, waga, maks, szer) {
  let r = maks;
  do { g.font = waga + ' ' + r + 'px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif'; r -= 2; } while (r > 12 && g.measureText(tekst).width > szer);
}
/** Karta z kodem QR ucznia (do telefonu lub wydruku). */
function kartaQr(u) {
  const m = QRMacierz(u.kod);
  const n = m.length, modul = 18, marg = 4;
  const W = (n + marg * 2) * modul;
  const H = W + 210;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (m[r][k]) g.fillRect((k + marg) * modul, (r + marg) * modul, modul, modul);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#111';
  dopasujCzcionke(g, imieNazwisko(u), 'bold', 44, W - 48);
  g.fillText(imieNazwisko(u), W / 2, W + 34);
  const opis = opisKlasaPokoj(u);
  g.fillStyle = '#444';
  dopasujCzcionke(g, opis, 'normal', 30, W - 48);
  g.fillText(opis, W / 2, W + 82);
  g.fillStyle = '#2453c4';
  dopasujCzcionke(g, Stan.nazwa, '600', 26, W - 48);
  g.fillText(Stan.nazwa, W / 2, W + 128);
  g.fillStyle = '#888';
  g.font = '20px ui-monospace, Menlo, Consolas, monospace';
  g.fillText(u.kod, W / 2, W + 170);
  return c;
}
function nazwaPlikuQr(u) {
  const czysty = t => String(t || '').replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, z => { const m = POLSKIE[z.toLowerCase()]; return z === z.toLowerCase() ? m : m.toUpperCase(); }).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');

}

// ── import listy uczniów
function parsujTekstTabeli(tekst) {
  tekst = String(tekst || '').replace(/^\uFEFF/, '');
  const pierwsza = tekst.split(/\r?\n/).find(l => l.trim()) || '';
  const ile = z => (pierwsza.match(new RegExp(z === '\t' ? '\t' : '\\' + z, 'g')) || []).length;
  const sep = ile('\t') ? '\t' : ile(';') >= ile(',') && ile(';') ? ';' : ile(',') ? ',' : '\t';
  const wiersze = [];
  let w = [], pole = '', cudz = false;
  for (let i = 0; i < tekst.length; i++) {
    const z = tekst[i];
    if (cudz) {
      if (z === '"') { if (tekst[i + 1] === '"') { pole += '"'; i++; } else cudz = false; }
      else pole += z;
    } else if (z === '"' && pole === '') cudz = true;
    else if (z === sep) { w.push(pole); pole = ''; }
    else if (z === '\n' || z === '\r') { if (z === '\r' && tekst[i + 1] === '\n') i++; w.push(pole); wiersze.push(w); w = []; pole = ''; }
    else pole += z;
  }
  if (pole !== '' || w.length) { w.push(pole); wiersze.push(w); }
  return wiersze.map(r => r.map(x => String(x).trim())).filter(r => r.some(x => x !== ''));
}
function wierszeNaUczniow(wiersze) {
  let start = 0, mapa = null;
  for (let i = 0; i < Math.min(10, wiersze.length); i++) {
    const n = wiersze[i].map(norm);
    const iN = n.findIndex(x => x.indexOf('nazwisko') === 0 && x.indexOf('imie') < 0);
    const iI = n.findIndex(x => x.indexOf('imie') === 0 && x.indexOf('nazwisko') < 0);
    if (iN >= 0 && iI >= 0) {
      mapa = { n: iN, i: iI, k: n.findIndex(x => x.indexOf('klasa') === 0), p: n.findIndex(x => x.indexOf('pokoj') === 0 || x.indexOf('nr pokoju') === 0), g: n.findIndex(x => x.indexOf('grupa') === 0), po: n.findIndex(x => x.indexOf('posilki') === 0) };
      start = i + 1;
      break;
    }
  }
  const uwagi = [];
  let jednaKolumna = false;
  if (!mapa) {
    for (let i = 0; i < Math.min(10, wiersze.length) && !mapa; i++) {
      const n = wiersze[i].map(norm);
      const iNI = n.findIndex(x => x.indexOf('nazwisko') >= 0 && x.indexOf('imie') >= 0);
      if (iNI >= 0) {
        mapa = { ni: iNI, imieNajpierw: n[iNI].indexOf('imie') < n[iNI].indexOf('nazwisko'), k: n.findIndex(x => x.indexOf('klasa') === 0), p: n.findIndex(x => x.indexOf('pokoj') === 0 || x.indexOf('nr pokoju') === 0), g: n.findIndex(x => x.indexOf('grupa') === 0), po: n.findIndex(x => x.indexOf('posilki') === 0) };
        start = i + 1;
        uwagi.push('Imię i nazwisko są w jednej kolumnie – rozdzielono je automatycznie. Sprawdź podgląd (osoby z dwoma nazwiskami mogą wymagać poprawki).');
      }
    }
  }
  if (!mapa) {
    jednaKolumna = wiersze.length > 0 && wiersze.every(r => r.filter(Boolean).length === 1);
    mapa = { n: 0, i: 1, k: 2, p: 3 };
    if (wiersze.length && norm(wiersze[0].join(' ')).indexOf('nazwisko') >= 0) start = 1;
    uwagi.push(jednaKolumna ? 'Nie znaleziono nagłówków – każdy wiersz rozdzielono jako „Nazwisko Imię”. Sprawdź podgląd.' : 'Nie znaleziono nagłówków „Nazwisko” i „Imię” – przyjęto kolejność kolumn: Nazwisko, Imię, Klasa, Pokój.');
  }
  const uczniowie = [];
  for (let i = start; i < wiersze.length; i++) {
    const r = wiersze[i];
    let u;
    if (mapa.ni !== undefined) {
      const t = String(r[mapa.ni] || '').split(/\s+/).filter(Boolean);
      const imie = mapa.imieNajpierw ? t.slice(0, 1).join(' ') : t.slice(1).join(' ');
      const nazwisko = mapa.imieNajpierw ? t.slice(1).join(' ') : t.slice(0, 1).join(' ');
      u = { nazwisko: nazwisko, imie: imie, klasa: mapa.k >= 0 ? (r[mapa.k] || '') : '', pokoj: mapa.p >= 0 ? (r[mapa.p] || '') : '' };
    } else if (jednaKolumna) {
      const t = r.filter(Boolean)[0].split(/\s+/);
      u = { nazwisko: t[0] || '', imie: t.slice(1).join(' '), klasa: '', pokoj: '' };
    } else {
      u = { nazwisko: r[mapa.n] || '', imie: r[mapa.i] || '', klasa: mapa.k >= 0 ? (r[mapa.k] || '') : '', pokoj: mapa.p >= 0 ? (r[mapa.p] || '') : '' };
    }
    if (!u.nazwisko && !u.imie) continue;
    u.grupa = mapa.g >= 0 ? String(r[mapa.g] || '').replace(/^\s*gr(upa)?\.?\s*/i, '').trim() : '';
    u.posilki = mapa.po >= 0 ? (/^(tak|t|x|1|yes)$/i.test(String(r[mapa.po] || '').trim()) ? 'TAK' : 'NIE') : '';
    uczniowie.push(u);
  }
  return { uczniowie, uwagi };
}
async function wczytajPlikImportu(plik) {
  const wynik = $('#imp-wynik');

    if (/\.xlsx$/i.test(plik.name)) wiersze = await czytajXlsx(await plik.arrayBuffer());
    else if (/\.xls$/i.test(plik.name)) throw new Error('Stary format .xls nie jest obsługiwany – zapisz plik jako .xlsx albo skopiuj i wklej dane.');

      <td>${u._stan === 'nowy' ? '<span class="chip s-IN">nowy</span>' : u._stan === 'istnieje' ? '<span class="szary">już jest</span>' : '<span class="chip s-LATE">brak imienia lub nazwiska</span>'}</td></tr>`).join('')}</tbody></table></div>
    <div class="przyciski"><button class="przycisk" data-a="imp-dodaj" ${nowi ? '' : 'disabled'}>Dodaj ${nowi} ${nowi === 1 ? 'ucznia' : 'uczniów'}</button>
    <span class="szary">Pominięci: ${uczniowie.length - nowi}</span></div>`;
}

    const crc = crc32(dane);

    dv.setUint32(18, dane.length, true); dv.setUint32(22, dane.length, true); dv.setUint16(26, nazwa.length, true); dv.setUint16(28, 0, true);
    lok.set(nazwa, 30);
    czesci.push(lok, dane);
    const cen = new Uint8Array(46 + nazwa.length);
    const dc = new DataView(cen.buffer);
    dc.setUint32(0, 0x02014b50, true); dc.setUint16(4, 20, true); dc.setUint16(6, 20, true); dc.setUint16(8, 0x0800, true); dc.setUint16(10, 0, true);

    { nazwa: 'xl/_rels/workbook.xml.rels', dane: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { nazwa: 'xl/styles.xml', dane: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd.mm.yyyy hh:mm"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' },

}
/** Odczyt pierwszego arkusza z pliku .xlsx (bez zewnętrznych bibliotek). */
async function czytajXlsx(bufor) {
  const dv = new DataView(bufor);
  let koniec = -1;
  for (let i = bufor.byteLength - 22; i >= Math.max(0, bufor.byteLength - 65600); i--) { if (dv.getUint32(i, true) === 0x06054b50) { koniec = i; break; } }
  if (koniec < 0) throw new Error('To nie jest prawidłowy plik .xlsx.');
  const ile = dv.getUint16(koniec + 10, true);
  let p = dv.getUint32(koniec + 16, true);
  const dek = new TextDecoder('utf-8');
  const wpisy = {};
  for (let k = 0; k < ile; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Uszkodzony plik .xlsx.');
    const metoda = dv.getUint16(p + 10, true), rozmC = dv.getUint32(p + 20, true);
    const dlN = dv.getUint16(p + 28, true), dlE = dv.getUint16(p + 30, true), dlK = dv.getUint16(p + 32, true), lok = dv.getUint32(p + 42, true);
    const nazwa = dek.decode(new Uint8Array(bufor, p + 46, dlN));
    p += 46 + dlN + dlE + dlK;
    if (!/^xl\/(workbook\.xml|sharedStrings\.xml|_rels\/workbook\.xml\.rels|worksheets\/[^/]+\.xml)$/.test(nazwa)) continue;
    const start = lok + 30 + dv.getUint16(lok + 26, true) + dv.getUint16(lok + 28, true);
    const surowe = new Uint8Array(bufor, start, rozmC);
    let dane;
    if (metoda === 0) dane = surowe;
    else if (metoda === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('Ta przeglądarka nie odczyta pliku .xlsx – skopiuj dane z Excela i wklej je w pole powyżej.');
      dane = new Uint8Array(await new Response(new Blob([surowe]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    } else throw new Error('Nieobsługiwana kompresja w pliku .xlsx.');
    wpisy[nazwa] = dek.decode(dane);
  }
  const xml = t => new DOMParser().parseFromString(t, 'application/xml');
  const poNazwie = (el, n) => Array.from(el.getElementsByTagNameNS('*', n));
  const atr = (el, n) => { for (const a of Array.from(el.attributes)) if (a.localName === n) return a.value; return null; };
  let sciezka = 'xl/worksheets/sheet1.xml';
  if (wpisy['xl/workbook.xml'] && wpisy['xl/_rels/workbook.xml.rels']) {
    const pierwszy = poNazwie(xml(wpisy['xl/workbook.xml']), 'sheet')[0];
    const rid = pierwszy ? atr(pierwszy, 'id') : null;
    const rel = poNazwie(xml(wpisy['xl/_rels/workbook.xml.rels']), 'Relationship').find(r => r.getAttribute('Id') === rid);
    if (rel) { const cel = rel.getAttribute('Target'); sciezka = cel.charAt(0) === '/' ? cel.slice(1) : 'xl/' + cel.replace(/^\.\//, ''); }
  }
  if (!wpisy[sciezka]) sciezka = Object.keys(wpisy).filter(n => n.indexOf('xl/worksheets/') === 0).sort()[0];
  if (!sciezka || !wpisy[sciezka]) throw new Error('W pliku nie znaleziono arkusza.');
  const wspolne = wpisy['xl/sharedStrings.xml'] ? poNazwie(xml(wpisy['xl/sharedStrings.xml']), 'si').map(si => poNazwie(si, 't').filter(t => !t.parentNode || t.parentNode.localName !== 'rPh').map(t => t.textContent).join('')) : [];
  const wiersze = [];
  poNazwie(xml(wpisy[sciezka]), 'row').forEach(row => {
    const w = [];
    poNazwie(row, 'c').forEach(c => {
      const ref = c.getAttribute('r') || '';
      const lit = (ref.match(/^[A-Z]+/) || [''])[0];
      let idx = w.length;
      if (lit) { idx = 0; for (const ch of lit) idx = idx * 26 + (ch.charCodeAt(0) - 64); idx -= 1; }
      const typ = c.getAttribute('t');
      const v = poNazwie(c, 'v')[0];
      let wart = '';
      if (typ === 's') wart = wspolne[Number(v ? v.textContent : -1)] || '';
      else if (typ === 'inlineStr') wart = poNazwie(c, 't').map(t => t.textContent).join('');
      else if (typ === 'b') wart = v && v.textContent === '1' ? 'TAK' : 'NIE';
      else wart = v ? v.textContent : '';
      while (w.length < idx) w.push('');
      w[idx] = String(wart).trim();
    });
    if (w.some(x => x !== '')) wiersze.push(w);
  });
  return wiersze;
}
function pobierzPlik(blob, nazwa) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nazwa; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
function drukuj(html) {
  const w = $('#wydruk');
  w.innerHTML = html;
  document.body.classList.add('drukowanie');
  const sprzataj = () => { document.body.classList.remove('drukowanie'); w.innerHTML = ''; window.removeEventListener('afterprint', sprzataj); };
  window.addEventListener('afterprint', sprzataj);
  const obrazy = $$('img', w).map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()));
  Promise.all(obrazy).then(() => setTimeout(() => window.print(), 60));
}
function kopiuj(tekst) {
  const awaryjnie = () => {
    const t = document.createElement('textarea');
    t.value = tekst; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast('Skopiowano link.', 'ok'); } catch (e) { toast('Zaznacz i skopiuj link ręcznie.', 'blad'); }
    t.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tekst).then(() => toast('Skopiowano link.', 'ok'), awaryjnie);
  else awaryjnie();
}
