  } else if (f.typ === 'WEEKEND_WYPIS') {

      ${c.chipy.length ? '<div class="chipy2">' + c.chipy.map(x => '<span class="' + x[1] + '"' + (x[1] === 'czerw' ? ' style="background:#fff;color:#bd2525"' : '') + '>' + esc(x[0]) + '</span>').join('') + '</div>' : ''}
      ${c.notka ? '<div class="notka">' + esc(c.notka) + '</div>' : ''}
      ${c.zolta ? '<div class="zolta2">' + ikona('wychowawca', 2.2) + esc(c.zolta) + '</div>' : ''}
      ${c.wroc ? '<button class="btn-wroc ' + (c.wroc.kolor || '') + '" data-p="wroc"' + (c.wroc.kolor === 'moj' ? ' style="background:#4b2a9a"' : '') + '><b>' + esc(c.wroc.tekst) + '</b><small>' + esc(c.wroc.pod) + '</small></button>' : ''}
    </div>
    <div class="dol"><button class="btn-cofnij" data-p="cofnij">Cofnij (<span>${Math.round(COFNIJ_MS / 1000)}</span> s)</button><button class="btn-zamknij2" data-p="zamknij">${c.wroc ? 'Zamknij' : 'Dotknij ekranu, aby zamknąć'}</button></div>`;
  document.body.appendChild(el);
  St.potw = { el: el, uid: ev.uid, mig: mig, flow: f };
  let zostalo = Math.round(COFNIJ_MS / 1000);
  St.potwOdl = setInterval(() => {
    zostalo--;
    const s = $('.btn-cofnij span', el);
    if (s) s.textContent = Math.max(0, zostalo);
    if (zostalo <= 0) { clearInterval(St.potwOdl); const b = $('.btn-cofnij', el); if (b) b.remove(); }
  }, 1000);
  St.potwTimer = setTimeout(() => zamknijPotwierdzenie2(true), c.zolta || c.wroc ? COFNIJ_MS + 2000 : COFNIJ_MS);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-p]');
    if (b && b.dataset.p === 'cofnij') return cofnij();
    if (b && b.dataset.p === 'wroc') { zamknijPotwierdzenie2(true); c.wroc.fn(); return; }
    zamknijPotwierdzenie2(true);
  });
}
function zamknijPotwierdzenie2(wyslij) {
  clearTimeout(St.potwTimer);
  clearInterval(St.potwOdl);
  const p = St.potw;
  if (!p) return;
  St.potw = null;
  if (p.el) p.el.remove();
  if (wyslij) {
    const ev = Stan.kolejka.find(e => e.uid === p.uid);
    if (ev) { ev.wstrzymaj = 0; zapiszKolejke(); }
    wyslijKolejke();
  }
  if (!St.ekran) St.flow = null;
  if (Stan.widok === 'skaner') odswiezStanowisko();
}
function cofnij() {
  const p = St.potw;
  if (!p) return;
  const i = Stan.kolejka.findIndex(e => e.uid === p.uid);
  if (i < 0) { toast('Za późno – zapis został już wysłany.', 'blad'); zamknijPotwierdzenie2(false); return; }
  Stan.kolejka.splice(i, 1);
  zapiszKolejke();
  przywroc(p.mig);
  Stan.ostatnie = Stan.ostatnie.filter(x => x.uid !== p.uid);
  Pamiec.set('ostatnie', Stan.ostatnie);
  const flow = p.flow;
  St.potw = null;
  clearTimeout(St.potwTimer);
  clearInterval(St.potwOdl);
  p.el.remove();
  toast('Cofnięto – nic się nie zapisało.', 'ok');
  St.flow = flow;
  Skan.czas = Date.now();
  ekranPodpis(true);
}

  if (!m) return;
  try {
    const d = await api('mojInternat', m.weekend ? { weekend: m.weekend } : {});
    if (!d.ok) throw new BladApi(d.blad || 'Nie udało się pobrać danych.', 'serwer');
    m.dane = d; m.blad = ''; m.czas = Date.now();
  } catch (e) {
    if (e.rodzaj !== 'auth') m.blad = e.message;
  }
  if (Stan.zakladka === 'moj') rysujWynikiMoj();
}

async function obsluzKlikMoj(e) {
  const m = Stan.moj;
  const wk = e.target.closest('[data-wk]');
  if (wk) { m.weekend = wk.dataset.wk; m.dane = null; rysujWynikiMoj(); return zaladujMoj(); }
  const zw = e.target.closest('[data-zwrot]');
  if (zw) {
    const x = m.dane.wydane.find(y => y.rid === zw.dataset.zwrot);
    if (!x) return;
    const ok = await potwierdz({ tytul: 'Zapisać zwrot?', tresc: x.nazwa + ' – ' + x.u + ' (pokój ' + x.p + '). Użyj, gdy rzecz oddano wychowawcy albo uczeń zapomniał podpisać zwrot.', tak: 'Zapisz zwrot', ikona: false });
    if (!ok) return;
    return zapiszZPanelu({ uid: nowyUid(), id: x.id, akcja: 'ZWROT', ts: teraz(), sposob: 'panel', urzadzenie: 'Panel wychowawcy', rzecz: x.rid, notatka: 'oddane wychowawcy' }, 'Zapisano zwrot: ' + x.nazwa);
  }
  const wy = e.target.closest('[data-wypisz]');
  if (wy) {
    const x = m.dane.weekend.zapisani.find(y => String(y.id) === wy.dataset.wypisz);
    const ok = await potwierdz({ tytul: 'Wypisać z weekendu?', tresc: (x ? x.u + ' (pokój ' + x.p + ')' : 'Uczeń') + ' – weekend ' + opisWeekendu(m.dane.weekend.piatek) + '.', tak: 'Wypisz', ikona: false });
    if (!ok) return;
    return zapiszZPanelu({ uid: nowyUid(), id: Number(wy.dataset.wypisz), akcja: 'WEEKEND_WYPIS', ts: teraz(), sposob: 'panel', urzadzenie: 'Panel wychowawcy', weekend: m.dane.weekend.piatek }, 'Wypisano z weekendu.');
  }
  const b = e.target.closest('[data-a="dopisz"]');
  if (b) oknoDopiszWeekend();
}
async function zapiszZPanelu(ev, komunikat) {
  try {
    const d = await api('zapisz', { zdarzenia: [ev] });
    if (!d.ok || !d.wyniki || !d.wyniki[0] || !d.wyniki[0].ok) throw new BladApi((d.wyniki && d.wyniki[0] && d.wyniki[0].blad) || d.blad || 'Nie zapisano.', 'serwer');
    Stan.zapisGen++;
    (d.uczniowie || []).forEach(aktualizujUcznia);
    if (d.rzeczy || d.weekend) ustawDane({ rzeczy: d.rzeczy, weekend: d.weekend });
    toast(komunikat, 'ok');
    rysujKpi();
    if (Stan.zakladka === 'moj') zaladujMoj();
    return true;
  } catch (err) {
    if (err.rodzaj !== 'auth') toast(err.message, 'blad', 6000);
    return false;
  }
}
function oknoDopiszWeekend() {

  const zapisani = new Set(w.zapisani.map(x => x.id));
  const uczniowie = Stan.uczniowie.filter(u => !zapisani.has(u.id)).sort((a, b) => porownaj(a.i, b.i) || porownaj(a.n, b.n));
  const opcje = [['cały weekend · ' + opisDniaKr(pt) + ' – ' + opisDniaKr(nd), 'Cały weekend'], ['do soboty · ' + opisDniaKr(pt) + ' – ' + opisDniaKr(sob), 'Do soboty'], ['od soboty · ' + opisDniaKr(sob) + ' – ' + opisDniaKr(nd), 'Od soboty']];
  const n = otworzNakladke(`<div class="okno" role="dialog" aria-modal="true"><h2>Dopisz do weekendu ${esc(opisWeekendu(pt))}</h2>
      <p class="szary">Wychowawca może dopisać ucznia także po zamknięciu zapisów.</p>
      <label for="dw-uczen">Uczeń</label><select id="dw-uczen"><option value="">— wybierz —</option>${uczniowie.map(u => `<option value="${u.id}">${esc(imieNazwisko(u))} · pokój ${esc(u.p)}</option>`).join('')}</select>
      <label for="dw-opcja">Zostaje</label><select id="dw-opcja">${opcje.map(o => `<option value="${esc(o[0])}">${esc(o[1])} (${esc(o[0].split(' · ')[1])})</option>`).join('')}</select>
      <p class="blad-tekst" id="dw-blad"></p>
      <div class="stopka"><button class="przycisk drugi" data-a="zamknij">Anuluj</button><button class="przycisk fiolet" data-a="zapisz">Dopisz</button></div></div>`);
  n.addEventListener('click', async e => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    if (b.dataset.a === 'zamknij') return zamknijNakladke(n);
    const id = Number($('#dw-uczen', n).value);

    b.disabled = true;
    const ok = await zapiszZPanelu({ uid: nowyUid(), id: id, akcja: 'WEEKEND_ZAPIS', ts: teraz(), sposob: 'panel', urzadzenie: 'Panel wychowawcy', weekend: pt, opis: $('#dw-opcja', n).value }, 'Dopisano do weekendu.');

  });

// ── kody QR (rysowanie)
function rysujQr(canvas, tekst, modul, margines) {
  const m = QRMacierz(tekst);
  const n = m.length;
  const rozmiar = (n + margines * 2) * modul;
  canvas.width = rozmiar; canvas.height = rozmiar;
  const g = canvas.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, rozmiar, rozmiar);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) g.fillRect((c + margines) * modul, (r + margines) * modul, modul, modul);
  return canvas;
}
function dopasujCzcionke(g, tekst, waga, maks, szer) {
  let r = maks;
  do { g.font = waga + ' ' + r + 'px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif'; r -= 2; } while (r > 12 && g.measureText(tekst).width > szer);
}
/** Karta z kodem QR ucznia (do telefonu lub wydruku). */
function kartaQr(u) {
  const m = QRMacierz(u.kod);
  const n = m.length, modul = 18, marg = 4;
  const W = (n + marg * 2) * modul;
  const H = W + 210;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (m[r][k]) g.fillRect((k + marg) * modul, (r + marg) * modul, modul, modul);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#111';
  dopasujCzcionke(g, imieNazwisko(u), 'bold', 44, W - 48);
  g.fillText(imieNazwisko(u), W / 2, W + 34);
  const opis = opisKlasaPokoj(u);
  g.fillStyle = '#444';
  dopasujCzcionke(g, opis, 'normal', 30, W - 48);
  g.fillText(opis, W / 2, W + 82);
  g.fillStyle = '#2453c4';
  dopasujCzcionke(g, Stan.nazwa, '600', 26, W - 48);
  g.fillText(Stan.nazwa, W / 2, W + 128);
  g.fillStyle = '#888';
  g.font = '20px ui-monospace, Menlo, Consolas, monospace';
  g.fillText(u.kod, W / 2, W + 170);
  return c;
}

function parsujTekstTabeli(tekst) {
  tekst = String(tekst || '').replace(/^\uFEFF/, '');
  const pierwsza = tekst.split(/\r?\n/).find(l => l.trim()) || '';
  const ile = z => (pierwsza.match(new RegExp(z === '\t' ? '\t' : '\\' + z, 'g')) || []).length;
  const sep = ile('\t') ? '\t' : ile(';') >= ile(',') && ile(';') ? ';' : ile(',') ? ',' : '\t';
  const wiersze = [];
  let w = [], pole = '', cudz = false;
  for (let i = 0; i < tekst.length; i++) {
    const z = tekst[i];
    if (cudz) {
      if (z === '"') { if (tekst[i + 1] === '"') { pole += '"'; i++; } else cudz = false; }
      else pole += z;
    } else if (z === '"' && pole === '') cudz = true;
    else if (z === sep) { w.push(pole); pole = ''; }
    else if (z === '\n' || z === '\r') { if (z === '\r' && tekst[i + 1] === '\n') i++; w.push(pole); wiersze.push(w); w = []; pole = ''; }
    else pole += z;
  }
  if (pole !== '' || w.length) { w.push(pole); wiersze.push(w); }
  return wiersze.map(r => r.map(x => String(x).trim())).filter(r => r.some(x => x !== ''));
}

    const crc = crc32(dane);

    const dv = new DataView(lok.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, dosCzas, true); dv.setUint16(12, dosData, true); dv.setUint32(14, crc, true);
    dv.setUint32(18, dane.length, true); dv.setUint32(22, dane.length, true); dv.setUint16(26, nazwa.length, true); dv.setUint16(28, 0, true);
    lok.set(nazwa, 30);
    czesci.push(lok, dane);
    const cen = new Uint8Array(46 + nazwa.length);
    const dc = new DataView(cen.buffer);
    dc.setUint32(0, 0x02014b50, true); dc.setUint16(4, 20, true); dc.setUint16(6, 20, true); dc.setUint16(8, 0x0800, true); dc.setUint16(10, 0, true);

    przes += lok.length + dane.length;

function xmlEsc(t) { return String(t == null ? '' : t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function zbudujXlsx(nazwaArkusza, wiersze, szerokosci) {

    { nazwa: '_rels/.rels', dane: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { nazwa: 'xl/workbook.xml', dane: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + xmlEsc(nazwaArkusza).slice(0, 31) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { nazwa: 'xl/_rels/workbook.xml.rels', dane: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { nazwa: 'xl/styles.xml', dane: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd.mm.yyyy hh:mm"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' },

/** Odczyt pierwszego arkusza z pliku .xlsx (bez zewnętrznych bibliotek). */
async function czytajXlsx(bufor) {
  const dv = new DataView(bufor);
  let koniec = -1;
  for (let i = bufor.byteLength - 22; i >= Math.max(0, bufor.byteLength - 65600); i--) { if (dv.getUint32(i, true) === 0x06054b50) { koniec = i; break; } }

  let p = dv.getUint32(koniec + 16, true);
  const dek = new TextDecoder('utf-8');
  const wpisy = {};
  for (let k = 0; k < ile; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Uszkodzony plik .xlsx.');
    const metoda = dv.getUint16(p + 10, true), rozmC = dv.getUint32(p + 20, true);
    const dlN = dv.getUint16(p + 28, true), dlE = dv.getUint16(p + 30, true), dlK = dv.getUint16(p + 32, true), lok = dv.getUint32(p + 42, true);
    const nazwa = dek.decode(new Uint8Array(bufor, p + 46, dlN));
    p += 46 + dlN + dlE + dlK;
    if (!/^xl\/(workbook\.xml|sharedStrings\.xml|_rels\/workbook\.xml\.rels|worksheets\/[^/]+\.xml)$/.test(nazwa)) continue;
    const start = lok + 30 + dv.getUint16(lok + 26, true) + dv.getUint16(lok + 28, true);
    const surowe = new Uint8Array(bufor, start, rozmC);
    let dane;
    if (metoda === 0) dane = surowe;
    else if (metoda === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('Ta przeglądarka nie odczyta pliku .xlsx – skopiuj dane z Excela i wklej je w pole powyżej.');
      dane = new Uint8Array(await new Response(new Blob([surowe]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    } else throw new Error('Nieobsługiwana kompresja w pliku .xlsx.');
    wpisy[nazwa] = dek.decode(dane);
  }
  const xml = t => new DOMParser().parseFromString(t, 'application/xml');
  const poNazwie = (el, n) => Array.from(el.getElementsByTagNameNS('*', n));
  const atr = (el, n) => { for (const a of Array.from(el.attributes)) if (a.localName === n) return a.value; return null; };
  let sciezka = 'xl/worksheets/sheet1.xml';
  if (wpisy['xl/workbook.xml'] && wpisy['xl/_rels/workbook.xml.rels']) {
    const pierwszy = poNazwie(xml(wpisy['xl/workbook.xml']), 'sheet')[0];
    const rid = pierwszy ? atr(pierwszy, 'id') : null;
    const rel = poNazwie(xml(wpisy['xl/_rels/workbook.xml.rels']), 'Relationship').find(r => r.getAttribute('Id') === rid);
    if (rel) { const cel = rel.getAttribute('Target'); sciezka = cel.charAt(0) === '/' ? cel.slice(1) : 'xl/' + cel.replace(/^\.\//, ''); }
  }
  if (!wpisy[sciezka]) sciezka = Object.keys(wpisy).filter(n => n.indexOf('xl/worksheets/') === 0).sort()[0];
  if (!sciezka || !wpisy[sciezka]) throw new Error('W pliku nie znaleziono arkusza.');
  const wspolne = wpisy['xl/sharedStrings.xml'] ? poNazwie(xml(wpisy['xl/sharedStrings.xml']), 'si').map(si => poNazwie(si, 't').filter(t => !t.parentNode || t.parentNode.localName !== 'rPh').map(t => t.textContent).join('')) : [];
  const wiersze = [];
  poNazwie(xml(wpisy[sciezka]), 'row').forEach(row => {
    const w = [];
    poNazwie(row, 'c').forEach(c => {
      const ref = c.getAttribute('r') || '';
      const lit = (ref.match(/^[A-Z]+/) || [''])[0];
      let idx = w.length;
      if (lit) { idx = 0; for (const ch of lit) idx = idx * 26 + (ch.charCodeAt(0) - 64); idx -= 1; }
      const typ = c.getAttribute('t');
      const v = poNazwie(c, 'v')[0];
      let wart = '';
      if (typ === 's') wart = wspolne[Number(v ? v.textContent : -1)] || '';
      else if (typ === 'inlineStr') wart = poNazwie(c, 't').map(t => t.textContent).join('');
      else if (typ === 'b') wart = v && v.textContent === '1' ? 'TAK' : 'NIE';
      else wart = v ? v.textContent : '';
      while (w.length < idx) w.push('');
      w[idx] = String(wart).trim();
    });
    if (w.some(x => x !== '')) wiersze.push(w);
  });
  return wiersze;
}
